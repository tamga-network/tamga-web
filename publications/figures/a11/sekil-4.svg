<rect x="20" y="16" width="276" height="54" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="158" y="34.9" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Kamu kurumları</text>
<text x="158" y="51.1" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">madde 5f(1)</text><rect x="20" y="78" width="276" height="200" rx="8" fill="#EEF5F8" stroke="#CFC7B6" stroke-width="1"/><text x="158" y="100.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Elektronik kimlik istedikleri</text><text x="158" y="120.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">çevrimiçi hizmette cüzdanı</text><text x="158" y="140.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">da kabul eder</text><text x="158" y="180.0" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Tarih metinde yok</text><rect x="312" y="16" width="276" height="54" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="450" y="34.9" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Düzenlenmiş özel sektör</text>
<text x="450" y="51.1" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">madde 5f(2)</text><rect x="312" y="78" width="276" height="200" rx="8" fill="#FAF4E4" stroke="#CFC7B6" stroke-width="1"/><text x="450" y="100.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Hukuk ya da sözleşme güçlü</text><text x="450" y="120.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kullanıcı doğrulaması istiyorsa</text><text x="450" y="140.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ulaşım · enerji · bankacılık</text><text x="450" y="160.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">finans · sosyal güvenlik · sağlık</text><text x="450" y="180.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">içme suyu · posta · dijital</text><text x="450" y="200.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">altyapı · eğitim · telekom</text><text x="450" y="240.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">24 Aralık 2027</text><text x="450" y="260.0" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Mikro ve küçük işletmeler muaf</text><rect x="604" y="16" width="276" height="54" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="742" y="34.9" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Çok büyük platformlar</text>
<text x="742" y="51.1" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">madde 5f(3)</text><rect x="604" y="78" width="276" height="200" rx="8" fill="#EEF5F8" stroke="#CFC7B6" stroke-width="1"/><text x="742" y="100.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kullanıcı doğrulaması</text><text x="742" y="120.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">istiyorlarsa cüzdanı da kabul</text><text x="742" y="140.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">eder; yalnız gereken en az</text><text x="742" y="160.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">veriyle</text><text x="742" y="200.0" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Tarih metinde yok</text><rect x="20" y="292" width="860" height="40" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="450" y="312.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Her durumda: yalnızca kullanıcının gönüllü isteği üzerine · cüzdan kullanmak zorunlu değildir (5a(15))</text>
