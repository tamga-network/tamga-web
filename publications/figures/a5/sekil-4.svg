<text x="735" y="323.2" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">birbirini eşleştiremez</text><line x1="20" y1="362" x2="880" y2="362" stroke="#1E5A78" stroke-width="1"/><text x="450" y="384.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">K1–K4: aynı mantıksal belgenin teknik kopyaları. A ve B'yi desteklemek zorunlu, C ve D isteğe bağlı (ARF 3.0.0).</text>
