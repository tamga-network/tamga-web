<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="900" height="478" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="478" fill="#FFFFFF"/>
<text x="280" y="22.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">TS 119 612 güven listesi (XML)</text><text x="745" y="22.0" font-size="13" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">TS 119 602 güvenilen kuruluş listesi</text><text x="745" y="40.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">(JSON ya da XML)</text><rect x="20" y="38" width="520" height="400" rx="8" fill="#FFFFFF" stroke="#14120F" stroke-width="1.4"/><rect x="40" y="55" width="480" height="70" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="280" y="75.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Şema bilgisi</text>
<text x="280" y="90.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">liste türü · sıra numarası · işletmeci · ülke</text>
<text x="280" y="105.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yayım tarihi · sonraki güncelleme · diğer listelere işaretçiler</text><rect x="40" y="140" width="480" height="215" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="280" y="158.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Güven hizmeti sağlayıcısı (TSP): ad · adres · bilgi adresi</text><rect x="60" y="175" width="440" height="165" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.2"/><text x="280" y="193.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Hizmet</text><text x="280" y="210.5" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">tür (URI) · ad · dijital kimlik (sertifika)</text>
<text x="280" y="225.5" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">güncel durum · durum başlangıcı</text><rect x="80" y="260" width="400" height="64" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="280" y="284.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Hizmet geçmişi</text>
<text x="280" y="299.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">önceki durumlar ve başlangıç tarihleri (silinmez)</text><rect x="40" y="370" width="480" height="52" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="280" y="396.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İmza (XAdES)</text><rect x="600" y="55" width="290" height="383" rx="8" fill="#FFFFFF" stroke="#14120F" stroke-width="1.4"/><rect x="620" y="70" width="250" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="745" y="95.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Liste ve şema bilgisi</text><line x1="522" y1="90" x2="618" y2="95" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><rect x="620" y="170" width="250" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="745" y="195.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Güvenilen kuruluş (TE)</text><line x1="522" y1="158" x2="618" y2="195" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><rect x="620" y="245" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="745" y="270.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Hizmet (profile göre durum)</text><line x1="522" y1="230" x2="618" y2="270" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><rect x="620" y="370" width="250" height="50" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="745" y="395.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İmza (JAdES ya da XAdES)</text><line x1="522" y1="396" x2="618" y2="395" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><text x="570" y="160.0" font-size="10.5" font-weight="600" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">TSP → TE</text><text x="455" y="462.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">TS 119 602, TS 119 612'nin her tür güvenilen kuruluşa genelleştirilmiş hâlidir.</text>
</svg>
