<text x="465" y="234.0" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kayıt, belgenin verildiği anda etkin miydi?</text><line x1="465" y1="258" x2="465" y2="274" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="473" y="266.0" font-size="10.5" font-weight="400" fill="#2F7A55" text-anchor="start" dominant-baseline="middle">evet</text><line x1="632" y1="234" x2="698" y2="234" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="662" y="224.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">hayır</text><rect x="700" y="214" width="180" height="40" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="790" y="234.0" font-size="12.5" font-weight="700" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">REDDET</text><rect x="300" y="276" width="330" height="44" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="465" y="298.0" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kurum bu belge türünü vermeye yetkili mi?</text><line x1="465" y1="322" x2="465" y2="338" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="473" y="330.0" font-size="10.5" font-weight="400" fill="#2F7A55" text-anchor="start" dominant-baseline="middle">evet</text><line x1="632" y1="298" x2="698" y2="298" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="662" y="288.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">hayır</text><rect x="700" y="278" width="180" height="40" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="790" y="298.0" font-size="12.5" font-weight="700" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">REDDET</text><rect x="300" y="340" width="330" height="44" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="465" y="362.0" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Liste taze mi? (sonraki güncelleme geçmemiş)</text><line x1="465" y1="386" x2="465" y2="402" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="473" y="394.0" font-size="10.5" font-weight="400" fill="#2F7A55" text-anchor="start" dominant-baseline="middle">evet</text><line x1="632" y1="362" x2="698" y2="362" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="662" y="352.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">hayır</text><rect x="700" y="342" width="180" height="40" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="790" y="354.9" font-size="11" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">BELİRSİZ</text>
<text x="790" y="369.2" font-size="11" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">şu an doğrulanamadı</text><rect x="300" y="404" width="330" height="44" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="465" y="426.0" font-size="14" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">KABUL</text><rect x="20" y="140" width="230" height="110" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="135" y="171.6" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Önceden ve düzenli:</text>
<text x="135" y="187.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">listeleri indir,</text>
<text x="135" y="202.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">imzalarını ve tazeliğini</text>
<text x="135" y="218.4" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">doğrula, belleğe al</text><line x1="252" y1="195" x2="298" y2="170" stroke="#C8A24C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arg)"/><line x1="252" y1="205" x2="298" y2="234" stroke="#C8A24C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arg)"/><line x1="252" y1="215" x2="298" y2="298" stroke="#C8A24C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arg)"/><text x="135" y="268.0" font-size="11" font-weight="400" fill="#C8A24C" text-anchor="middle" dominant-baseline="middle" font-style="italic">yerel kopya</text><text x="20" y="438.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">Hiçbir adımda belge verene ya da</text>
<text x="20" y="453.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">liste işletmecisine istek gitmez.</text>
