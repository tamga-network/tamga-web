<text x="465" y="42.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Belge gelir: imza + sertifika zinciri</text><line x1="465" y1="66" x2="465" y2="82" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="300" y="84" width="330" height="44" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
