  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="545" fill="#FFFFFF"/>
<rect x="20" y="12" width="860" height="38" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="450" y="31.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Hepsinin çapası: Komisyon'un ve üye devletlerin imzaladığı listeler</text><rect x="30" y="170" width="210" height="80" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="135" y="194.4" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Belge veren</text>
<text x="135" y="210.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(PID sağlayıcı ya da</text>
<text x="135" y="225.6" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">öznitelik onayı veren)</text><rect x="660" y="170" width="210" height="80" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="765" y="201.9" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Güvenen taraf</text>
<text x="765" y="218.1" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(doğrulayıcı)</text><rect x="390" y="90" width="120" height="230" rx="16" fill="#FFFFFF" stroke="#1E5A78" stroke-width="2.4"/>
<rect x="432" y="98" width="36" height="5" rx="2.5" fill="#1E5A78"/><text x="450" y="196.6" font-size="13" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kişinin</text>
<text x="450" y="213.5" font-size="13" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cüzdanı</text><line x1="242" y1="190" x2="386" y2="190" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><circle cx="314" cy="175" r="10" fill="#1E5A78"/><text x="314" y="175.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><line x1="386" y1="232" x2="242" y2="232" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><circle cx="314" cy="248" r="10" fill="#1E5A78"/><text x="314" y="248.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><line x1="514" y1="190" x2="656" y2="190" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><circle cx="585" cy="175" r="10" fill="#1E5A78"/><text x="585" y="175.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><line x1="656" y1="232" x2="514" y2="232" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><circle cx="585" cy="248" r="10" fill="#1E5A78"/><text x="585" y="248.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><rect x="350" y="360" width="200" height="46" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="450" y="383.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdan sağlayıcı</text><line x1="450" y1="358" x2="450" y2="324" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="458" y="341.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">uygulamayı ve birim kanıtını sağlar</text><circle cx="40" cy="440" r="10" fill="#1E5A78"/><text x="40" y="440.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text><text x="60" y="440.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Belge veren cüzdanı doğrular</text><text x="330" y="440.0" font-size="12" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">→ cüzdan sağlayıcıları listesi</text><circle cx="40" cy="466" r="10" fill="#1E5A78"/><text x="40" y="466.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text><text x="60" y="466.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Cüzdan güvenen tarafı doğrular</text><text x="330" y="466.0" font-size="12" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">→ erişim ve kayıt sertifikası sağlayıcıları listeleri</text><circle cx="40" cy="492" r="10" fill="#1E5A78"/><text x="40" y="492.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text><text x="60" y="492.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Güvenen taraf belgeyi doğrular</text><text x="330" y="492.0" font-size="12" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">→ PID sağlayıcıları, güven listeleri, PuB-EAA listesi</text><circle cx="40" cy="518" r="10" fill="#1E5A78"/><text x="40" y="518.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4</text><text x="60" y="518.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Cüzdan belge vereni doğrular</text><text x="330" y="518.0" font-size="12" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">→ belge veren listeleri ve sertifikaları</text>
</svg>
