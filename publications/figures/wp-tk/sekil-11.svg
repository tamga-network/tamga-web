<rect x="20" y="20" width="330" height="150" rx="6" fill="#E3EFE8" stroke="#2F7A55" stroke-width="1.4"/><text x="185" y="65.7" font-size="11" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Guramanyň gol çeken JWT-si</text><text x="185" y="83.7" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">sözbaşy: alg ES256, typ dc+sd-jwt, x5c</text><text x="185" y="97.3" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">mazmun: iss, vct, vct#integrity, iat,</text><text x="185" y="111.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cnf, status, _sd [heşler]</text><text x="185" y="124.6" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">guramanyň goly</text><text x="366" y="95.0" font-size="28" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">~</text><rect x="384" y="20" width="230" height="150" rx="6" fill="#F2F8F4" stroke="#2F7A55" stroke-width="1.4" stroke-dasharray="6 4"/><text x="499" y="38.0" font-size="12" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Açyşlar</text><rect x="404" y="54" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><text x="499" y="68.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">A1: [duz, at, baha]</text><rect x="404" y="90" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><text x="499" y="104.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">A2: [duz, at, baha]</text><rect x="404" y="126" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><text x="499" y="140.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">…</text><text x="632" y="95.0" font-size="28" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">~</text><rect x="650" y="20" width="230" height="150" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="765" y="79.4" font-size="11" font-weight="700" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">Açar baglanyşyk JWT-si (KB-JWT)</text><text x="765" y="97.3" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">nonce, aud, iat, sd_hash</text><text x="765" y="111.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">enjamdaky açar bilen gol</text><path d="M404,68 C370,110 330,120 300,118" fill="none" stroke="#1E5A78" stroke-width="1.1" marker-end="url(#arm)"/><rect x="249.9" y="192.8" width="204.1" height="14.4" fill="#FFFFFF"/>
<text x="352" y="200.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">her açyşyň SHA-256 heşi _sd-iň içinde</text><path d="M760,172 C700,250 300,260 220,128" fill="none" stroke="#1E5A78" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arg)"/><rect x="413.9" y="228.8" width="172.3" height="14.4" fill="#FFFFFF"/>
<text x="500" y="236.0" font-size="10" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">şol bir açar: cnf ↔ KB-JWT goly</text><rect x="20" y="270" width="860" height="30" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/><text x="450" y="285.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Gapjykda duran: JWT~A1~A2~…~An~</text><rect x="20" y="308" width="860" height="30" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="450" y="323.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Barlaýja gidýän: JWT~A2~A5~KB-JWT</text>
