<text x="450" y="332.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">ÝB barlaýjysy öz islegi bilen Tamga sanawyny goşup biler; bu hukuk ykrary däl</text><rect x="40" y="50" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><text x="120" y="75.0" font-size="12" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Bir döwlet</text><rect x="700" y="50" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><text x="780" y="75.0" font-size="12" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Ýewropa Bileleşigi</text><line x1="204" y1="75" x2="696" y2="75" stroke="#C8A24C" stroke-width="3" marker-end="url(#arg)"/><text x="450" y="56.0" font-size="10" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">14-nji madda: ýerine ýetiriş namasy ýa-da şertnama (TFEU 218-nji madda) · özara</text><text x="450" y="96.0" font-size="10" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">ynam sanawy · diňe ynam hyzmatlary</text><line x1="140" y1="266" x2="300" y2="80" stroke="#C8A24C" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="108.2" y="188.8" width="283.6" height="14.4" fill="#FFFFFF"/>
<text x="250" y="196.0" font-size="10" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">toruň roly tehniki taýýarlyk; şertnamanyň tarapy däl</text><rect x="560" y="166" width="320" height="50" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="720" y="184.8" font-size="9.5" font-weight="500" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">5f madda: ÝB-de ÝB gapjyklaryny kabul etmek</text>
