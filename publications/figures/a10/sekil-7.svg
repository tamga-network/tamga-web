<text x="810" y="130.7" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Yeni cüzdan kurulur;</text>
<text x="810" y="145.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">PID ve belgeler</text>
<text x="810" y="159.3" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yeniden alınır</text><text x="20" y="222.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">Telefondaki anahtarlar kopyalanamaz; telefonu bulan kişi PIN ya da biyometri olmadan imza atamaz.</text>
