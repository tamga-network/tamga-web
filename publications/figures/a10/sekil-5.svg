<text x="790" y="40.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">PID sağlayıcı</text><line x1="110" y1="64" x2="110" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="335" y1="64" x2="335" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="565" y1="64" x2="565" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="790" y1="64" x2="790" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="10" y="76" width="880" height="24" fill="#EEF5F8"/><text x="20" y="88.0" font-size="12" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Etkinleştirme (ve sonra düzenli olarak)</text><line x1="565" y1="130" x2="112" y2="130" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="337.5" y="119.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Cihaz ve uygulama kanıtı ister</text><line x1="110" y1="166" x2="563" y2="166" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="337.5" y="155.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. İmzalı platform kanıtı</text><line x1="565" y1="204" x2="337" y2="204" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="450" y="193.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. Platform kanıtı + yeni açık anahtarlar</text><rect x="225" y="220" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="335" y="240.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. Kanıtları doğrular</text><line x1="335" y1="288" x2="563" y2="288" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="450" y="277.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. WIA (24 saatten kısa) + anahtar kanıtı</text><rect x="10" y="310" width="880" height="24" fill="#EEF5F8"/><text x="20" y="322.0" font-size="12" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Belge alma</text><line x1="565" y1="362" x2="788" y2="362" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="677.5" y="351.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">6. WIA + sahiplik kanıtı</text><line x1="565" y1="404" x2="788" y2="404" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="677.5" y="393.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">7. Belge isteği + anahtar kanıtı</text><rect x="682" y="420" width="206" height="70" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="785" y="440.7" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">8. İmzaları cüzdan</text>
<text x="785" y="455.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">sağlayıcılar listesinden</text>
<text x="785" y="469.3" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">doğrular, düzeyi kontrol eder</text><line x1="790" y1="514" x2="567" y2="514" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="677.5" y="503.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">9. PID, KA'daki anahtara bağlı</text><rect x="225" y="470" width="220" height="56" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="335" y="490.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Durum listeleri</text>
<text x="335" y="505.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">WIA · anahtar kanıtı</text><line x1="680" y1="470" x2="447" y2="492" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><text x="548" y="462.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">en az 24 saatte bir kontrol</text><text x="880" y="588.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">Platform kanıtı yalnız cüzdan sağlayıcıya gider; WIA ve anahtar kanıtı yalnız belge veren kurumlara.</text>
</svg>
