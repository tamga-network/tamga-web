<text x="335" y="40.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdan sağlayıcı</text><rect x="470" y="16" width="190" height="48" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
