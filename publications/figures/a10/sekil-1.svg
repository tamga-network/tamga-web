<text x="450" y="292.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">belge</text><rect x="20" y="30" width="270" height="66" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="155" y="52.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Telefonu bulan ya da çalan kişi</text><text x="155" y="76.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">kilidi aşıp belge göstermek</text><rect x="20" y="168" width="270" height="66" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="155" y="190.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kötü amaçlı uygulama</text><text x="155" y="214.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">anahtarı ya da belgeyi kopyalamak</text><rect x="20" y="306" width="270" height="66" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="155" y="328.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Sahte ya da değiştirilmiş cüzdan</text><text x="155" y="352.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">kurumdan belge almak, PIN çalmak</text><rect x="610" y="30" width="270" height="66" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="745" y="52.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Donanım laboratuvarı olan saldırgan</text><text x="745" y="76.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">çipten anahtarı fiziksel yolla çıkarmak</text><rect x="610" y="168" width="270" height="66" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="745" y="190.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aşırı meraklı taraflar</text><text x="745" y="214.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">kişinin nerede ne gösterdiğini izlemek</text><line x1="292" y1="72" x2="383" y2="150" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><line x1="292" y1="201" x2="383" y2="201" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><line x1="292" y1="330" x2="383" y2="290" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><line x1="608" y1="72" x2="517" y2="150" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><line x1="608" y1="201" x2="517" y2="201" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><rect x="610" y="300" width="270" height="92" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
