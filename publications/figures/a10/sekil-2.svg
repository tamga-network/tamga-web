<rect x="0" y="0" width="900" height="400" fill="#FFFFFF"/>
<rect x="20" y="20" width="580" height="360" rx="22" fill="#EEF5F8" stroke="#1E5A78" stroke-width="2"/><text x="40" y="46.0" font-size="12.5" font-weight="600" fill="#174A63" text-anchor="start" dominant-baseline="middle">Sıradan çalışma ortamı (REE): Android ya da iOS, uygulamalar</text><rect x="44" y="140" width="170" height="56" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="129" y="168.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdan uygulaması</text><rect x="44" y="220" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#CFC7B6" stroke-width="1.4"/>
<text x="129" y="242.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Başka uygulamalar</text><rect x="44" y="280" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#CFC7B6" stroke-width="1.4"/>
<text x="129" y="302.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İnternet, bildirimler</text><rect x="268" y="70" width="312" height="290" rx="14" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.6"/><text x="284" y="94.0" font-size="12.5" font-weight="600" fill="#174A63" text-anchor="start" dominant-baseline="middle">Güvenilir yürütme ortamı (TEE)</text><rect x="300" y="120" width="250" height="210" rx="12" fill="#FAF4E4" stroke="#C8A24C" stroke-width="2"/><text x="425" y="138.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Güvenli eleman ya da</text>
<text x="425" y="153.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Secure Enclave, StrongBox</text><g transform="translate(395,222) scale(1.4)"><circle cx="0" cy="0" r="6" fill="none" stroke="#C8A24C" stroke-width="2.4"/>
<path d="M6,0 H20 M15,0 V5 M19,0 V4" stroke="#C8A24C" stroke-width="2.4" fill="none" stroke-linecap="round"/></g><text x="425" y="252.0" font-size="12.5" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">gizli anahtar</text><text x="425" y="276.9" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">anahtar burada üretilir</text>
<text x="425" y="291.2" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">ve buradan çıkmaz</text><line x1="216" y1="158" x2="298" y2="158" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="257" y="146.0" font-size="10.5" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">şunu imzala</text><line x1="298" y1="182" x2="216" y2="182" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="257" y="196.0" font-size="10.5" font-weight="600" fill="#C8A24C" text-anchor="middle" dominant-baseline="middle">imza</text><rect x="630" y="40" width="22" height="22" rx="4" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="664" y="46.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Sıradan ortam</text><text x="664" y="59.2" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">kalabalık; en çok saldırıya</text>
<text x="664" y="72.8" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">uğrayan yer</text><rect x="630" y="130" width="22" height="22" rx="4" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="664" y="136.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">TEE</text><text x="664" y="149.2" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">işlemcide donanımla ayrılmış,</text>
<text x="664" y="162.8" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">kendi küçük işletim sistemi</text><rect x="630" y="220" width="22" height="22" rx="4" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="664" y="226.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Güvenli eleman</text><text x="664" y="239.2" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">ayrı çip; fiziksel saldırılara</text>
<text x="664" y="252.8" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">karşı dayanıklı</text><rect x="630" y="300" width="250" height="80" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="755" y="325.7" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Saldırgan sıradan ortamı ele</text>
<text x="755" y="340.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">geçirse bile anahtarı kopyalayamaz;</text>
<text x="755" y="354.3" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">en fazla imza istemeyi dener.</text>
