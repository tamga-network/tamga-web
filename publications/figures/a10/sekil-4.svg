<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="446" fill="#FFFFFF"/>
<rect x="30" y="18" width="220" height="50" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="140" y="35.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur'un telefonu</text>
<text x="140" y="50.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(cüzdan + cihaz anahtarı)</text><rect x="340" y="18" width="220" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="450" y="35.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdan sağlayıcının WSCA'sı</text>
<text x="450" y="50.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(erişim denetimi)</text><rect x="650" y="18" width="220" height="50" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="760" y="35.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">HSM</text>
<text x="760" y="50.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(PID anahtarı burada)</text><line x1="140" y1="68" x2="140" y2="360" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="450" y1="68" x2="450" y2="360" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="760" y1="68" x2="760" y2="360" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="45" y="88" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#C8A24C" stroke-width="1.4"/>
<text x="140" y="105.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Aynur PIN'ini girer</text><line x1="140" y1="160" x2="448" y2="160" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="295" y="148.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. Cihaz anahtarıyla imzalı istek + PIN kanıtı</text><rect x="325" y="178" width="250" height="46" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="450" y="193.8" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. Cihaz anahtarını ve PIN'i doğrular</text>
<text x="450" y="208.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(yanlış deneme sayacı)</text><line x1="450" y1="256" x2="758" y2="256" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="605" y="244.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. “Şu veriyi PID anahtarıyla imzala”</text><line x1="760" y1="300" x2="452" y2="300" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="605" y="288.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. İmza</text><line x1="450" y1="340" x2="142" y2="340" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="295" y="328.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">6. İmza telefona döner</text><rect x="30" y="380" width="410" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="235" y="397.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">PID anahtarı HSM'den hiç çıkmaz; kullanmak için</text>
<text x="235" y="412.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">hem telefon hem PIN gerekir.</text><rect x="460" y="380" width="410" height="50" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="665" y="397.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Sağlayıcı, imzalanan içeriği ve kişinin cüzdanı</text>
<text x="665" y="412.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">nerede kullandığını görmeyecek biçimde kurulmalıdır.</text>
</svg>
