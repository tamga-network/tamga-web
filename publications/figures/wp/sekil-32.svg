<text x="800" y="168.2" font-size="9.5" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">çelişki olayı: ilk X, gelen Y</text><line x1="450" y1="232" x2="698" y2="232" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="512.7" y="200.8" width="124.6" height="15.8" fill="#FFFFFF"/>
<text x="575" y="208.7" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. kendi doğruladığı</text>
<rect x="509.8" y="215.1" width="130.4" height="15.8" fill="#FFFFFF"/>
<text x="575" y="223.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">listeden X'i hesaplar</text><rect x="714" y="212" width="172" height="44" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="800" y="227.8" font-size="9.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">aday 1, destek 2 = k</text>
<text x="800" y="240.2" font-size="9.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">onaylandı; sürüm 42 kapandı</text><line x1="270" y1="304" x2="698" y2="304" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><rect x="419.8" y="287.1" width="130.4" height="15.8" fill="#FFFFFF"/>
<text x="485" y="295.0" font-size="11" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">4. B yeniden gönderir</text><rect x="714" y="286" width="172" height="44" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="800" y="301.8" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">ret: bu sürüm için zaten</text>
<text x="800" y="314.2" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">bir aday destekledin</text><rect x="195.6" y="396.4" width="508.9" height="15.1" fill="#FFFFFF"/>
<text x="450" y="404.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Bir yazıcı, bir aday · çıkarılan yazıcının desteği sayılmaz · onaysız aday &quot;evet&quot; üretmez.</text>
