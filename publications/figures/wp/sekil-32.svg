<text x="395" y="87.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. sürüm 42 için X</text><rect x="714" y="82" width="172" height="28" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/><text x="800" y="96.0" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">aday 1 (X), destek 1</text><line x1="270" y1="160" x2="698" y2="160" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="428.5" y="143.1" width="112.9" height="15.8" fill="#FFFFFF"/>
