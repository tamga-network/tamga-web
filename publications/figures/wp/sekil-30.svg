<rect x="0" y="0" width="900" height="312" fill="#FFFFFF"/>
<line x1="60" y1="70" x2="840" y2="70" stroke="#1E5A78" stroke-width="2"/><circle cx="90" cy="70" r="12" fill="#1E5A78" stroke="#1E5A78" stroke-width="2.4"/><rect x="2" y="96" width="176" height="92" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="90" y="120.5" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Liste aşaması (bugün)</text><text x="90" y="138.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">çapa: imzalı listeler + çapa</text><text x="90" y="151.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">günlüğü</text><text x="90" y="164.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yöneten: geçici işletmeci</text><circle cx="330" cy="70" r="12" fill="#FFFFFF" stroke="#1E5A78" stroke-width="2.4"/><rect x="242" y="96" width="176" height="92" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="330" y="120.5" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Defter aşaması</text><text x="330" y="138.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">çapa: ortak defter (liste</text><text x="330" y="151.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kayıtlarının özetleri)</text><text x="330" y="164.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yöneten: ilk işletmeciler</text><circle cx="570" cy="70" r="12" fill="#FFFFFF" stroke="#1E5A78" stroke-width="2.4"/><rect x="482" y="96" width="176" height="92" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="570" y="127.0" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Devlet katılımı</text><text x="570" y="145.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">çapa: ortak defter</text><text x="570" y="158.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yöneten: konsey (üçte iki)</text><circle cx="800" cy="70" r="12" fill="#FFFFFF" stroke="#1E5A78" stroke-width="2.4"/><rect x="712" y="96" width="176" height="92" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="800" y="127.0" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Kurumsal genişleme</text><text x="800" y="145.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">çapa: ortak defter</text><text x="800" y="158.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yöneten: konsey</text><rect x="110.3" y="17.0" width="199.3" height="13.7" fill="#FFFFFF"/>
<text x="210" y="23.8" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">≥ 2 bağımsız işletmeci, yazılı kabul +</text>
<rect x="165.7" y="29.4" width="88.6" height="13.7" fill="#FFFFFF"/>
<text x="210" y="36.2" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">eşdeğerlik testi</text><rect x="368.0" y="23.2" width="164.1" height="13.7" fill="#FFFFFF"/>
<text x="450" y="30.0" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">ilk devlet işletmecisi üretimde</text><rect x="638.2" y="23.2" width="93.6" height="13.7" fill="#FFFFFF"/>
<text x="685" y="30.0" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">konseyin eşikleri</text><path d="M150,62 l8,-12 l8,12 z" fill="#C8A24C"/><rect x="154.0" y="216.1" width="8.0" height="15.8" fill="#FFFFFF"/>
<text x="158" y="224.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle"></text><rect x="128.0" y="201.0" width="164.1" height="13.7" fill="#FFFFFF"/>
<text x="210" y="207.8" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">vakfa devir: işletmeci değişir,</text>
<rect x="158.2" y="213.4" width="103.7" height="13.7" fill="#FFFFFF"/>
<text x="210" y="220.2" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">listeler aynı kalır</text><rect x="14" y="250" width="872" height="32" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/><text x="450" y="266.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Değişmeyenler: kurum, kök ve belge türü kimlikleri · verilmiş belgeler · doğrulama hattı</text><text x="450" y="300.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Tarih yok; her geçiş bir koşula bağlıdır.</text>
</svg>
