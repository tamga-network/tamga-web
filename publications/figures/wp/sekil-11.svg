<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="350" fill="#FFFFFF"/>
<rect x="20" y="20" width="330" height="150" rx="6" fill="#E3EFE8" stroke="#2F7A55" stroke-width="1.4"/><text x="185" y="65.7" font-size="11" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Kurumun imzaladığı JWT</text><text x="185" y="83.7" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">başlık: alg ES256, typ dc+sd-jwt, x5c</text><text x="185" y="97.3" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">gövde: iss, vct, vct#integrity, iat,</text><text x="185" y="111.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cnf, status, _sd [özetler]</text><text x="185" y="124.6" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kurum imzası</text><text x="366" y="95.0" font-size="28" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">~</text><rect x="384" y="20" width="230" height="150" rx="6" fill="#F2F8F4" stroke="#2F7A55" stroke-width="1.4" stroke-dasharray="6 4"/><text x="499" y="38.0" font-size="12" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Açıklamalar</text><rect x="404" y="54" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><text x="499" y="68.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Açıklama 1: [tuz, ad, değer]</text><rect x="404" y="90" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><text x="499" y="104.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Açıklama 2: [tuz, ad, değer]</text><rect x="404" y="126" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><text x="499" y="140.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">…</text><text x="632" y="95.0" font-size="28" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">~</text><rect x="650" y="20" width="230" height="150" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="765" y="79.4" font-size="11" font-weight="700" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">Anahtar bağı JWT'si (KB-JWT)</text><text x="765" y="97.3" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">nonce, aud, iat, sd_hash</text><text x="765" y="111.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cihazdaki anahtarla imza</text><path d="M404,68 C370,110 330,120 300,118" fill="none" stroke="#1E5A78" stroke-width="1.1" marker-end="url(#arm)"/><rect x="242.0" y="192.8" width="220.0" height="14.4" fill="#FFFFFF"/>
<text x="352" y="200.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">her açıklamanın SHA-256 özeti _sd içinde</text><path d="M760,172 C700,250 300,260 220,128" fill="none" stroke="#1E5A78" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arg)"/><rect x="408.6" y="228.8" width="182.9" height="14.4" fill="#FFFFFF"/>
<text x="500" y="236.0" font-size="10" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">aynı anahtar: cnf ↔ KB-JWT imzası</text><rect x="20" y="270" width="860" height="30" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/><text x="450" y="285.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdanda duran: JWT~A1~A2~…~An~</text><rect x="20" y="308" width="860" height="30" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="450" y="323.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayıcıya giden: JWT~A2~A5~KB-JWT</text>
</svg>
