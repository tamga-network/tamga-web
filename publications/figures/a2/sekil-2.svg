<rect x="0" y="0" width="900" height="500" fill="#FFFFFF"/>
<rect x="20" y="14" width="860" height="44" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="450" y="36.0" font-size="13" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Güven listesi: hangi veren yetkili, açık anahtarı ne?</text><rect x="40" y="110" width="240" height="66" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="160" y="134.2" font-size="13.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Veren</text>
<text x="160" y="151.8" font-size="13.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Bakü'deki üniversite</text><rect x="620" y="110" width="240" height="66" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="740" y="134.2" font-size="13.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayan</text>
<text x="740" y="151.8" font-size="13.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İstanbul'daki şirket</text><rect x="330" y="330" width="240" height="66" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="450" y="354.2" font-size="13.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Sahip</text>
<text x="450" y="371.8" font-size="13.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur'un cüzdanı</text><line x1="170" y1="178" x2="360" y2="326" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="96.1" y="252.2" width="129.9" height="16.6" fill="#FFFFFF"/>
<text x="222" y="260.5" font-size="11.5" font-weight="400" fill="#174A63" text-anchor="end" dominant-baseline="middle">imzalı belgeyi verir</text>
<rect x="163.1" y="267.2" width="62.9" height="16.6" fill="#FFFFFF"/>
<text x="222" y="275.5" font-size="11.5" font-weight="400" fill="#174A63" text-anchor="end" dominant-baseline="middle">(bir kez)</text><line x1="540" y1="326" x2="730" y2="180" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="676.0" y="252.2" width="105.5" height="16.6" fill="#FFFFFF"/>
<text x="680" y="260.5" font-size="11.5" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">belgeyi gösterir</text>
<rect x="676.0" y="267.2" width="148.2" height="16.6" fill="#FFFFFF"/>
<text x="680" y="275.5" font-size="11.5" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">(her seferinde, onayla)</text><line x1="284" y1="143" x2="616" y2="143" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M444,137 l12,12 M456,137 l-12,12" stroke="#A8432F" stroke-width="2.6" stroke-linecap="round"/><text x="450" y="124.0" font-size="11" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle" font-style="italic">veren ile doğrulayan arasında doğrudan bağlantı yok</text><line x1="740" y1="60" x2="740" y2="106" stroke="#C8A24C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arg)"/><text x="750" y="84.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">önceden indirilir</text><line x1="160" y1="106" x2="160" y2="60" stroke="#C8A24C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arg)"/><text x="150" y="84.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle">listelenir</text><rect x="345" y="200" width="210" height="48" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="450" y="216.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Durum listesi</text>
<text x="450" y="231.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(veren yayımlar)</text><line x1="250" y1="178" x2="342" y2="212" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><text x="262" y="210.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle">yayımlar</text><line x1="557" y1="212" x2="650" y2="180" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><text x="450" y="266.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">doğrulayana toplu indirilir; kişiye özel soru yok</text><rect x="330" y="440" width="240" height="44" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="450" y="462.0" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdan sağlayıcı</text><line x1="450" y1="438" x2="450" y2="400" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><text x="586" y="462.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">cüzdanın güvenilir olduğunu kanıtlar</text>
