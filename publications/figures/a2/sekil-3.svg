<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" width="900" height="285" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="285" fill="#FFFFFF"/>
<path d="M20,44 v-10 h150 v10" fill="none" stroke="#1E5A78" stroke-width="1.4"/><text x="95" y="20.0" font-size="11" font-weight="600" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">belgeden</text><path d="M210,44 v-10 h340 v10" fill="none" stroke="#C8A24C" stroke-width="1.4"/><text x="380" y="20.0" font-size="11" font-weight="600" fill="#C8A24C" text-anchor="middle" dominant-baseline="middle">önceden indirilmiş herkese açık listelerden</text><path d="M590,44 v-10 h150 v10" fill="none" stroke="#1E5A78" stroke-width="1.4"/><text x="665" y="20.0" font-size="11" font-weight="600" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">cüzdandan</text><rect x="10" y="56" width="170" height="72" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="95" y="84.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Belge sağlam mı?</text>
<text x="95" y="99.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(verenin imzası)</text><line x1="182" y1="92" x2="198" y2="92" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><line x1="95" y1="130" x2="95" y2="200" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="103" y="166.0" font-size="11" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle">hayır</text><rect x="200" y="56" width="170" height="72" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="285" y="84.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. Veren yetkili mi?</text>
<text x="285" y="99.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(güven listesi)</text><line x1="372" y1="92" x2="388" y2="92" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><line x1="285" y1="130" x2="285" y2="200" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="293" y="166.0" font-size="11" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle">hayır</text><rect x="390" y="56" width="170" height="72" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="475" y="84.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. Hâlâ geçerli mi?</text>
<text x="475" y="99.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(süre + durum listesi)</text><line x1="562" y1="92" x2="578" y2="92" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><line x1="475" y1="130" x2="475" y2="200" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="483" y="166.0" font-size="11" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle">hayır</text><rect x="580" y="56" width="170" height="72" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="665" y="84.2" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. Gösteren sahibi mi?</text>
<text x="665" y="99.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(anahtar ispatı)</text><line x1="665" y1="130" x2="665" y2="200" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="673" y="166.0" font-size="11" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle">hayır</text><line x1="752" y1="92" x2="778" y2="92" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="780" y="66" width="110" height="52" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="835" y="92.0" font-size="14" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Kabul</text><rect x="10" y="202" width="740" height="36" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="380" y="220.0" font-size="13" font-weight="700" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Reddet</text><text x="890" y="270.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">Hiçbir adımda verene o anda soru sorulmaz.</text>
</svg>
