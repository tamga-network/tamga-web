<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="570" fill="#FFFFFF"/>
<rect x="30" y="16" width="200" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="130" y="39.0" font-size="13.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Veren</text><rect x="330" y="16" width="240" height="46" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="450" y="30.9" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur'un cüzdanı</text>
<text x="450" y="47.1" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(güvenli donanım)</text><rect x="670" y="16" width="200" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="770" y="39.0" font-size="13.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayan</text><line x1="130" y1="62" x2="130" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="450" y1="62" x2="450" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="770" y1="62" x2="770" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="20" y="84.0" font-size="12" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">Belge alınırken</text><rect x="300" y="96" width="300" height="40" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="450" y="116.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Anahtar çifti üretilir; gizli anahtar donanımda kalır</text><g transform="translate(610,116) scale(0.8)"><circle cx="0" cy="0" r="6" fill="none" stroke="#C8A24C" stroke-width="2.4"/>
<path d="M6,0 H20 M15,0 V5 M19,0 V4" stroke="#C8A24C" stroke-width="2.4" fill="none" stroke-linecap="round"/></g><line x1="450" y1="170" x2="132" y2="170" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="118.4" y="149.7" width="343.2" height="16.6" fill="#FFFFFF"/>
<text x="290" y="158.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. Açık anahtar + gizli anahtara sahip olduğunun kanıtı</text><line x1="130" y1="220" x2="448" y2="220" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="139.7" y="199.7" width="300.6" height="16.6" fill="#FFFFFF"/>
<text x="290" y="208.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. Belge: içinde açık anahtar, verenin imzasıyla</text><line x1="10" y1="252" x2="890" y2="252" stroke="#1E5A78" stroke-width="1" stroke-dasharray="5 4"/><text x="20" y="272.0" font-size="12" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">Belge gösterilirken</text><line x1="770" y1="305" x2="452" y2="305" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="484.1" y="284.7" width="251.8" height="16.6" fill="#FFFFFF"/>
<text x="610" y="293.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. İstek + tek kullanımlık değer (nonce)</text><rect x="275" y="330" width="350" height="58" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="450" y="351.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. Aynur onaylar; nonce + doğrulayan adresi + sunum</text>
<text x="450" y="366.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">özeti gizli anahtarla imzalanır</text><line x1="450" y1="420" x2="768" y2="420" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="481.1" y="399.7" width="257.9" height="16.6" fill="#FFFFFF"/>
<text x="610" y="408.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">6. Belge + seçilen alanlar + sahip imzası</text><rect x="605" y="446" width="280" height="74" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="745" y="468.7" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">7. Verenin imzası: belge sağlam mı?</text>
<text x="745" y="483.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Sahip imzası, belgedeki açık</text>
<text x="745" y="497.3" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">anahtarla: gösteren sahibi mi?</text><rect x="30" y="440" width="300" height="76" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="180" y="463.1" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Kopyalanan belge, gizli anahtar</text>
<text x="180" y="478.0" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">olmadan yeni bir nonce'u</text>
<text x="180" y="492.9" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">imzalayamaz.</text>
</svg>
