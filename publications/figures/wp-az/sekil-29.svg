<rect x="14" y="14" width="872" height="86" rx="8" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.2"/><text x="30" y="40.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">Şəbəkəyə üzvlük</text><text x="30" y="64.0" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">qəbul, çıxarma, protokol yeniləməsi</text><text x="870" y="40.0" font-size="9.5" font-weight="400" fill="#DDE8EE" text-anchor="end" dominant-baseline="middle" font-style="italic">qərar verən</text><text x="870" y="64.0" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="end" dominant-baseline="middle">üzv dövlətlər, üçdə iki (yeniləmədə 7 gün gözləmə)</text><rect x="14" y="114" width="872" height="86" rx="8" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.2"/><text x="30" y="140.0" font-size="13" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Milli qeydiyyatlar</text><text x="30" y="164.0" font-size="10.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">sənəd verənlər, yoxlayan tərəflər, kök</text><text x="870" y="140.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">qərar verən</text><text x="870" y="164.0" font-size="10.5" font-weight="600" fill="#14120F" text-anchor="end" dominant-baseline="middle">yalnız aidiyyəti dövlət; kənar səs yoxdur</text><rect x="14" y="214" width="872" height="86" rx="8" fill="#FAF4E4" stroke="#1E5A78" stroke-width="1.2"/><text x="30" y="240.0" font-size="13" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Sərhədlərarası tanınma</text><text x="30" y="264.0" font-size="10.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">&quot;X-in sənədlərini qəbul edirəmmi?&quot;</text><text x="870" y="240.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">qərar verən</text><text x="870" y="264.0" font-size="10.5" font-weight="600" fill="#14120F" text-anchor="end" dominant-baseline="middle">hər dövlət öz adından; birtərəfli</text><rect x="330" y="174" width="38" height="22" rx="3" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/><text x="349" y="185.0" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">TR</text><rect x="374" y="174" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="393" y="185.0" font-size="9.5" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">AZ</text><rect x="418" y="174" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="437" y="185.0" font-size="9.5" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">KZ</text><rect x="462" y="174" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="481" y="185.0" font-size="9.5" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">KG</text><rect x="506" y="174" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="525" y="185.0" font-size="9.5" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">UZ</text><rect x="550" y="174" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="569" y="185.0" font-size="9.5" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">HU</text><rect x="594" y="174" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="613" y="185.0" font-size="9.5" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">TM</text><line x1="420" y1="278" x2="470" y2="278" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><line x1="520" y1="290" x2="470" y2="290" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="14" y="314" width="872" height="30" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/><text x="450" y="329.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">çıxış hüququ (səs tələb olunmur) · çıxarma verilmiş sənədləri etibarsız etmir</text><text x="450" y="362.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Bu gün yalnız Türkiyə siyahısı aktivdir. Yerlər razılaşma və ya danışıqlar demək deyil.</text>
