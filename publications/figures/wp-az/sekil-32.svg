<text x="450" y="404.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Bir yazıcı, bir namizəd · çıxarılmış yazıcının dəstəyi sayılmır · təsdiqlənməmiş namizəd &quot;bəli&quot; vermir.</text>
