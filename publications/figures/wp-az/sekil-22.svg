<text x="450" y="284.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Məsafədən şəxsiyyət yoxlaması provayderi yalnız şəxsiyyət xidməti ilə əlaqə saxlayır; qurum, cüzdan və yoxlayan tərəf onu görmür.</text>
