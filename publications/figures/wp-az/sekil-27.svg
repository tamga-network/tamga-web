<text x="611" y="74.2" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">istifadə edilib&quot;</text><text x="20" y="160.0" font-size="12.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Sonra</text><line x1="30" y1="220" x2="690" y2="220" stroke="#14120F" stroke-width="1.2"/><rect x="30" y="176" width="154" height="64" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="107" y="201.8" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Nurlan QR-u göstərir</text>
