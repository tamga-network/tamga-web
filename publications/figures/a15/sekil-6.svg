<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="280" fill="#FFFFFF"/>
<rect x="20" y="20" width="196" height="40" rx="6" fill="#2F7A55" stroke="#2F7A55" stroke-width="1.4"/>
<text x="118" y="40.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1. Taşıma</text><rect x="20" y="66" width="196" height="104" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="118" y="110.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">TLS anahtar anlaşması</text>
<text x="118" y="125.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">→ karma ML-KEM</text><text x="118" y="184.8" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">şimdi topla, sonra çöz'e karşı;</text>
<text x="118" y="199.2" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">büyük ölçüde başladı</text><line x1="218" y1="118" x2="238" y2="118" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="240" y="20" width="196" height="40" rx="6" fill="#C8A24C" stroke="#C8A24C" stroke-width="1.4"/>
<text x="338" y="40.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2. Güven çapaları</text><rect x="240" y="66" width="196" height="104" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="338" y="103.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kök otoriteler, güven</text>
<text x="338" y="118.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">listeleri, CSCA → karma ya</text>
<text x="338" y="132.9" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">da kuantum sonrası imza</text><text x="338" y="184.8" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">en uzun ömürlü;</text>
<text x="338" y="199.2" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">erken başlamalı</text><line x1="438" y1="118" x2="458" y2="118" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="460" y="20" width="196" height="40" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="558" y="40.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3. Uzun ömürlü belgeler</text><rect x="460" y="66" width="196" height="104" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="558" y="95.6" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">diploma, pasaport → yeni</text>
<text x="558" y="110.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">verilişlerde karma imza;</text>
<text x="558" y="125.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">eskiler: yeniden verme</text>
<text x="558" y="140.4" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ya da arşiv damgası</text><text x="558" y="184.8" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">x büyük; belge döngüsü</text>
<text x="558" y="199.2" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">uzun</text><line x1="658" y1="118" x2="678" y2="118" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="680" y="20" width="196" height="40" rx="6" fill="#4A4740" stroke="#4A4740" stroke-width="1.4"/>
<text x="778" y="40.0" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">4. Kısa ömürlü imzalar</text><rect x="680" y="66" width="196" height="104" rx="6" fill="#F8F6F1" stroke="#4A4740" stroke-width="1.4"/>
<text x="778" y="103.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">PID yenilemesi, durum</text>
<text x="778" y="118.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">listeleri, sahip bağlama,</text>
<text x="778" y="132.9" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cüzdan beyanları</text><text x="778" y="184.8" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">x ≈ 0; cihaz desteği</text>
<text x="778" y="199.2" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">geldikçe</text><rect x="20" y="222" width="856" height="42" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="448" y="243.0" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Her basamakta: algoritmayı adlandır · birden çok anahtarı listele · tanımadığını güvenli reddet (kripto çeviklik)</text>
</svg>
