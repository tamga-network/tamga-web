<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="600" fill="#FFFFFF"/>
<rect x="30" y="20" width="220" height="50" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="140" y="45.0" font-size="13" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur (tarayıcı)</text><rect x="330" y="20" width="220" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="440" y="36.9" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Dil kursu sitesi</text>
<text x="440" y="53.1" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(güvenen taraf)</text><rect x="610" y="20" width="220" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="720" y="36.9" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Google</text>
<text x="720" y="53.1" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(kimlik sağlayıcı)</text><line x1="140" y1="70" x2="140" y2="590" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="440" y1="70" x2="440" y2="590" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="720" y1="70" x2="720" y2="590" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="140" y1="110" x2="438" y2="110" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="159.4" y="89.4" width="261.2" height="17.3" fill="#FFFFFF"/>
<text x="290" y="98.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. “Google ile giriş yap” düğmesine tıklar</text><line x1="440" y1="165" x2="142" y2="165" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="183.3" y="144.4" width="213.3" height="17.3" fill="#FFFFFF"/>
<text x="290" y="153.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. Tarayıcıyı Google'a yönlendirir</text><rect x="123.9" y="174.1" width="332.1" height="15.8" fill="#FFFFFF"/>
<text x="290" y="182.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">(site numarası, istenen bilgiler, tek kullanımlık değerler)</text><line x1="140" y1="225" x2="718" y2="225" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="266.5" y="204.4" width="326.9" height="17.3" fill="#FFFFFF"/>
<text x="430" y="213.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. Google'a giriş yapar (parola ya da geçiş anahtarı)</text><line x1="720" y1="280" x2="142" y2="280" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="197.8" y="259.4" width="464.5" height="17.3" fill="#FFFFFF"/>
<text x="430" y="268.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. İzin ekranı: “Site adınızı ve e-postanızı görmek istiyor” — Aynur onaylar</text><line x1="720" y1="335" x2="142" y2="335" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="251.6" y="314.4" width="356.8" height="17.3" fill="#FFFFFF"/>
<text x="430" y="323.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5a. Tek kullanımlık yetkilendirme koduyla geri yönlendirir</text><line x1="140" y1="380" x2="438" y2="380" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="219.2" y="359.4" width="141.6" height="17.3" fill="#FFFFFF"/>
<text x="290" y="368.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5b. Kodu siteye iletir</text><line x1="440" y1="435" x2="718" y2="435" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><rect x="431.5" y="414.4" width="297.0" height="17.3" fill="#FFFFFF"/>
<text x="580" y="423.0" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">6. Arka kanal: kod + sitenin kendi gizli bilgisi</text><line x1="720" y1="490" x2="442" y2="490" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="422.5" y="469.4" width="315.0" height="17.3" fill="#FFFFFF"/>
<text x="580" y="478.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">7. Kimlik belirteci (imzalı JWT) + erişim belirteci</text><rect x="315" y="522" width="250" height="46" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="440" y="537.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">8. İmzayı Google'ın açık anahtarıyla</text>
<text x="440" y="552.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">doğrular, Aynur'u içeri alır</text><rect x="758" y="200" width="136" height="72" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="826" y="221.7" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Site, Aynur'un</text>
<text x="826" y="236.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">parolasını hiç</text>
<text x="826" y="250.3" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">görmez.</text><rect x="758" y="420" width="136" height="72" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="826" y="441.7" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Google, Aynur'un</text>
<text x="826" y="456.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">bu siteye girdiğini</text>
<text x="826" y="470.3" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">öğrenir.</text>
</svg>
