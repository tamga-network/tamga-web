</defs>
<rect x="0" y="0" width="900" height="370" fill="#FFFFFF"/>
<rect x="20" y="40" width="200" height="230" rx="16" fill="#FFFFFF" stroke="#1E5A78" stroke-width="2.4"/>
<rect x="102" y="48" width="36" height="5" rx="2.5" fill="#1E5A78"/><rect x="36" y="74" width="168" height="80" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="120" y="99.0" font-size="10.5" font-weight="700" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">secure hardware</text><text x="120" y="116.3" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">credential keys</text><text x="120" y="129.3" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(never leave)</text><rect x="36" y="170" width="168" height="70" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="120" y="196.5" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">wallet app</text><text x="120" y="213.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">unit key</text><rect x="340" y="60" width="250" height="170" rx="6" fill="#F8F6F1" stroke="#4A4740" stroke-width="1.4"/><text x="465" y="80.0" font-size="12.5" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Wallet provider</text><text x="465" y="105.5" font-size="10" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">unit record: fingerprint, version,</text>
<text x="465" y="118.5" font-size="10" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">revocation status; no personal data</text><rect x="354" y="150" width="222" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4"/><text x="465" y="165.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">WIA status list (≥ 10,000)</text><rect x="354" y="188" width="222" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4"/><text x="465" y="203.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">KA status list (per type)</text><line x1="222" y1="90" x2="336" y2="90" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="208.0" y="51.0" width="143.9" height="13.7" fill="#FFFFFF"/>
<text x="280" y="57.8" font-size="9.5" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">at setup: unit registration</text>
<rect x="225.7" y="63.4" width="108.7" height="13.7" fill="#FFFFFF"/>
<text x="280" y="70.2" font-size="9.5" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">+ device attestation</text><line x1="222" y1="130" x2="336" y2="130" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="203.0" y="111.2" width="154.0" height="13.7" fill="#FFFFFF"/>
<text x="280" y="118.0" font-size="9.5" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">each transaction: request WIA</text><line x1="336" y1="210" x2="222" y2="210" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="223.1" y="223.0" width="113.7" height="13.7" fill="#FFFFFF"/>
<text x="280" y="229.8" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">WIA (&lt; 24 h, new key,</text>
<rect x="233.2" y="235.4" width="93.6" height="13.7" fill="#FFFFFF"/>
<text x="280" y="242.2" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">new sign-in) + KA</text><rect x="680" y="150" width="200" height="60" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="780" y="180.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Issuing institution</text><path d="M220,262 C400,330 600,300 700,214" fill="none" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="413.0" y="292.8" width="114.0" height="14.4" fill="#FFFFFF"/>
<text x="470" y="300.0" font-size="10" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">WIA + KA + key proof</text><rect x="680" y="30" width="200" height="50" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="780" y="48.2" font-size="10.5" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">Trust list:</text>
<text x="780" y="61.8" font-size="10.5" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">wallet_providers[]</text><line x1="780" y1="148" x2="780" y2="84" stroke="#C8A24C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arg)"/><rect x="780.0" y="103.0" width="123.8" height="13.7" fill="#FFFFFF"/>
<text x="784" y="109.8" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="start" dominant-baseline="middle">is the provider listed,</text>
<rect x="780.0" y="115.4" width="98.6" height="13.7" fill="#FFFFFF"/>
<text x="784" y="122.2" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="start" dominant-baseline="middle">is its key ACTIVE?</text><rect x="20" y="330" width="520" height="30" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="280" y="345.0" font-size="10.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">a new WIA per transaction: institutions cannot link the wallet</text><rect x="560" y="330" width="320" height="30" rx="6" fill="#EEEEEC" stroke="#4A4740" stroke-width="1.4"/><text x="720" y="345.0" font-size="10.5" font-weight="500" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">the network lists providers, it does not run them</text>
</svg>
