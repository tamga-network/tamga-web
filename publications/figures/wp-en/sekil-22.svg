<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="300" fill="#FFFFFF"/>
<rect x="14" y="60" width="196" height="96" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="112" y="93.0" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Remote identity proofing</text><text x="112" y="111.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">document scan, liveness, face</text><text x="112" y="124.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">match</text><rect x="37.5" y="169.2" width="149.0" height="13.7" fill="#FFFFFF"/>
<text x="112" y="176.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">only at the identity service</text><line x1="210" y1="108" x2="234" y2="108" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="236" y="60" width="196" height="96" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="334" y="93.0" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Identity credential</text><text x="334" y="111.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">in the wallet; SD-JWT VC + mdoc;</text><text x="334" y="124.0" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">10 copies</text><rect x="254.5" y="169.2" width="159.1" height="13.7" fill="#FFFFFF"/>
<text x="334" y="176.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">not a PID; a non-qualified EAA</text><line x1="432" y1="108" x2="456" y2="108" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="458" y="60" width="196" height="96" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="556" y="86.5" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Institution's matching</text><text x="556" y="104.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">matches its own record by ID</text><text x="556" y="117.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">number, date of birth, first and</text><text x="556" y="130.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">last name</text><rect x="476.5" y="169.2" width="159.1" height="13.7" fill="#FFFFFF"/>
<text x="556" y="176.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">the matching key is not stored</text><line x1="654" y1="108" x2="678" y2="108" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="680" y="60" width="196" height="96" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="778" y="99.5" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Institution credential</text><text x="778" y="117.5" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">diploma, student credential</text><rect x="150.5" y="32.8" width="167.0" height="14.4" fill="#FFFFFF"/>
<text x="234" y="40.0" font-size="10" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">OpenID4VCI, authorization code</text><rect x="369.9" y="32.8" width="172.3" height="14.4" fill="#FFFFFF"/>
<text x="456" y="40.0" font-size="10" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">OpenID4VP, selective disclosure</text><path d="M210,52 L232,90" fill="none" stroke="#4A4740" stroke-width="1" marker-end="url(#arm)"/><path d="M432,52 L454,90" fill="none" stroke="#4A4740" stroke-width="1" marker-end="url(#arm)"/><rect x="14" y="214" width="418" height="44" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4" stroke-dasharray="6 4"/><text x="223" y="236.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">When a state PID arrives: the state provider replaces 1 and 2</text><rect x="458" y="214" width="418" height="44" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4" stroke-dasharray="6 4"/><text x="667" y="236.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3 and 4 stay the same</text><rect x="117.4" y="276.8" width="665.2" height="14.4" fill="#FFFFFF"/>
<text x="450" y="284.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">The remote identity proofing provider talks only to the identity service; the institution, wallet and verifier never see it.</text>
</svg>
