<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="390" fill="#FFFFFF"/>
<rect x="10" y="230" width="880" height="150" rx="8" fill="#EEEEEC"/><text x="24" y="250.0" font-size="11" font-weight="700" fill="#4A4740" text-anchor="start" dominant-baseline="middle">Technical trust: unilateral, can be set up today</text><rect x="10" y="10" width="880" height="140" rx="8" fill="#1E5A78" opacity="0.92"/><text x="24" y="30.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">Legal recognition: between states, bilateral</text><rect x="30" y="270" width="220" height="100" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="140" y="298.5" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Tamga Network</text><text x="140" y="315.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">list of trusted lists</text><text x="140" y="328.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Türkiye list (active)</text><text x="140" y="341.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">other slots (empty)</text><rect x="650" y="270" width="220" height="100" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="760" y="305.0" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">European Union</text><text x="760" y="322.3" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">EU lists</text><text x="760" y="335.3" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">EU verifier</text><line x1="646" y1="296" x2="254" y2="296" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><rect x="305.0" y="277.2" width="290.0" height="13.7" fill="#FFFFFF"/>
<text x="450" y="284.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">EU lists can be referenced as external lists; none today</text><line x1="254" y1="344" x2="646" y2="344" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><rect x="229.5" y="325.2" width="441.0" height="13.7" fill="#FFFFFF"/>
<text x="450" y="332.0" font-size="9.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">An EU verifier may add the Tamga list of its own accord; this is not legal recognition</text><rect x="40" y="50" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><text x="120" y="75.0" font-size="12" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">A state</text><rect x="700" y="50" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><text x="780" y="75.0" font-size="12" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">European Union</text><line x1="204" y1="75" x2="696" y2="75" stroke="#C8A24C" stroke-width="3" marker-end="url(#arg)"/><text x="450" y="56.0" font-size="10" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Article 14: implementing act or agreement (TFEU Art. 218) · reciprocity</text><text x="450" y="96.0" font-size="10" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">trust list · trust services only</text><line x1="140" y1="266" x2="300" y2="80" stroke="#C8A24C" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="41.9" y="188.8" width="416.1" height="14.4" fill="#FFFFFF"/>
<text x="250" y="196.0" font-size="10" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">the network's role is technical readiness; it is not a party to the agreement</text><rect x="560" y="166" width="320" height="50" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="720" y="184.8" font-size="9.5" font-weight="500" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">Article 5f: obligation to accept EU wallets</text>
<text x="720" y="197.2" font-size="9.5" font-weight="500" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">within the EU; not third-country recognition</text>
</svg>
