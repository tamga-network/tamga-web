<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="380" fill="#FFFFFF"/>
<rect x="20" y="10" width="860" height="34" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="450" y="27.0" font-size="11" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">All fingerprints are in signed lists; the lists' signer is tied to an out-of-band trust anchor.</text><rect x="30" y="62" width="330" height="50" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/><text x="195" y="79.8" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">National root certificate (TR)</text>
<text x="195" y="94.1" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">provisional operator, on behalf of the state</text><path d="M60,112 L60,156 L84,156" fill="none" stroke="#1E5A78" stroke-width="1.2" marker-end="url(#ar)"/><rect x="86" y="132" width="280" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="226" y="147.5" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Institution credential signing certificate</text><text x="226" y="164.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ETSI TS 119 412-6; digitalSignature only</text><path d="M60,112 L60,216 L84,216" fill="none" stroke="#1E5A78" stroke-width="1.2" marker-end="url(#ar)"/><rect x="86" y="192" width="280" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="226" y="207.5" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Institution status list signing certificate</text><text x="226" y="224.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ETSI TS 119 412-6</text><path d="M60,112 L60,276 L84,276" fill="none" stroke="#1E5A78" stroke-width="1.2" marker-end="url(#ar)"/><rect x="86" y="252" width="280" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="226" y="267.5" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Verifier access certificate</text><text x="226" y="284.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ETSI TS 119 411-8</text><path d="M60,112 L60,336 L84,336" fill="none" stroke="#1E5A78" stroke-width="1.2" marker-end="url(#ar)"/><rect x="86" y="312" width="280" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="226" y="327.5" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">ETSI XML list signing certificate</text><text x="226" y="344.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">XML only</text><rect x="400" y="62" width="230" height="50" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/><text x="515" y="80.2" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Registrar key</text>
<text x="515" y="93.8" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">fingerprint in the LOTL</text><path d="M515,112 L515,148" fill="none" stroke="#1E5A78" stroke-width="1.2" marker-end="url(#ar)"/><rect x="400" y="152" width="230" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="515" y="167.5" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Registration certificates</text><text x="515" y="184.8" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">TS 119 475 · JWT, at most 12 months</text><path d="M515,200 L515,224" fill="none" stroke="#1E5A78" stroke-width="1.2" marker-end="url(#ar)"/><rect x="400" y="228" width="230" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="515" y="243.5" font-size="11" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">1-bit status list</text><text x="515" y="261.2" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">signed with the registrar's key</text><rect x="660" y="62" width="220" height="50" rx="6" fill="#F8F6F1" stroke="#4A4740" stroke-width="1.4"/><text x="770" y="80.2" font-size="10.5" font-weight="600" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">Wallet provider</text>
<text x="770" y="93.8" font-size="10.5" font-weight="600" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">certificate (in the list)</text><path d="M720,112 L720,152" fill="none" stroke="#4A4740" stroke-width="1.2" marker-end="url(#arm)"/><path d="M820,112 L820,152" fill="none" stroke="#4A4740" stroke-width="1.2" marker-end="url(#arm)"/><rect x="664" y="156" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4"/><text x="714" y="176.0" font-size="11" font-weight="600" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">WIA</text><rect x="776" y="156" width="104" height="40" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4"/><text x="828" y="176.0" font-size="11" font-weight="600" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">KA</text><text x="770" y="216.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">details in Sections 9.3 and 13</text>
</svg>
