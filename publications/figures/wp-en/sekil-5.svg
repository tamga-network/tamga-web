<rect x="150" y="20" width="600" height="86" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="450" y="40.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">On top of the network</text><rect x="200" y="56" width="230" height="36" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4"/><text x="315" y="74.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">wallets (registered in the list)</text><rect x="470" y="56" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4"/><text x="595" y="74.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">service providers (outside the network)</text><text x="450" y="118.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">not part of the network; participants</text><rect x="100" y="130" width="700" height="150" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="450" y="150.0" font-size="13.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Tamga Network: lightweight trust federation</text><rect x="120" y="166" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="195" y="181.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">list of trusted lists</text><rect x="290" y="166" width="44" height="30" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/><text x="312" y="181.0" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">TR</text><rect x="342" y="166" width="44" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="364" y="181.0" font-size="11" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">AZ</text><rect x="394" y="166" width="44" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="416" y="181.0" font-size="11" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">KZ</text><rect x="446" y="166" width="44" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="468" y="181.0" font-size="11" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">KG</text><rect x="498" y="166" width="44" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="520" y="181.0" font-size="11" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">UZ</text><rect x="550" y="166" width="44" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="572" y="181.0" font-size="11" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">HU</text><rect x="602" y="166" width="44" height="30" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="624" y="181.0" font-size="11" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">TM</text><text x="470" y="210.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">TR active · other slots reserved (dashed)</text><rect x="120" y="226" width="240" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="240" y="246.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">rules (ARF, Trust Framework, Rulebook)</text><rect x="372" y="226" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="452" y="246.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">open packages</text><rect x="544" y="226" width="236" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/><text x="662" y="246.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">reference services</text><rect x="50" y="296" width="800" height="84" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="450" y="318.0" font-size="13.5" font-weight="700" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">Base: EU alignment</text><text x="450" y="346.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">SD-JWT VC · mdoc · OpenID4VCI/VP · HAIP · ETSI lists · X.509</text><text x="450" y="366.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">valuable even if the network never grows</text><text x="860" y="205.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">grows as</text><text x="860" y="219.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">states</text><text x="860" y="233.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">join</text><line x1="26" y1="378" x2="26" y2="30" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><text x="16" y="205" font-size="10.5" fill="#4A4740" text-anchor="middle" transform="rotate(-90 16 205)" font-style="italic">each layer stands on its own</text><text x="450" y="400.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Reserved slots do not indicate any agreement or negotiation.</text>
