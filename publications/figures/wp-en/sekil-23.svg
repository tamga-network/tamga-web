<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="424" fill="#FFFFFF"/>
<circle cx="450" cy="210" r="70" fill="#EEF5F8" stroke="#1E5A78" stroke-width="2"/><text x="450" y="201.6" font-size="13" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Aynur's</text>
<text x="450" y="218.5" font-size="13" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">presentations</text><rect x="30" y="28" width="120" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="90" y="56.8" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Same copy, same</text>
<text x="90" y="69.2" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">signature and key</text><rect x="160" y="28" width="120" height="70" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="220" y="50.6" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">a separate copy and</text>
<text x="220" y="63.0" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">device key per</text>
<text x="220" y="75.3" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">verifier</text><line x1="280" y1="63" x2="384" y2="174" stroke="#A8432F" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arr)"/><line x1="150" y1="63" x2="160" y2="63" stroke="#4A4740" stroke-width="1"/><rect x="30" y="172" width="120" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="90" y="207.0" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Second of issuance</text><rect x="160" y="172" width="120" height="70" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="220" y="200.8" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">iat and exp rounded</text>
<text x="220" y="213.2" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">to the hour</text><line x1="280" y1="207" x2="384" y2="210" stroke="#A8432F" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arr)"/><line x1="150" y1="207" x2="160" y2="207" stroke="#4A4740" stroke-width="1"/><rect x="30" y="316" width="120" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="90" y="344.8" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Status list</text>
<text x="90" y="357.2" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">position</text><rect x="160" y="316" width="120" height="70" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="220" y="338.6" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">random position,</text>
<text x="220" y="351.0" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">bulk prefetch; ZK</text>
<text x="220" y="363.3" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">reveals no position</text><line x1="280" y1="351" x2="384" y2="246" stroke="#A8432F" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arr)"/><line x1="150" y1="351" x2="160" y2="351" stroke="#4A4740" stroke-width="1"/><rect x="750" y="28" width="120" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="810" y="56.8" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Site account</text>
<text x="810" y="69.2" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">identifier</text><rect x="620" y="28" width="120" height="70" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="680" y="63.0" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">per-site pseudonym</text><line x1="620" y1="63" x2="516" y2="174" stroke="#A8432F" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arr)"/><line x1="750" y1="63" x2="740" y2="63" stroke="#4A4740" stroke-width="1"/><rect x="750" y="172" width="120" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="810" y="207.0" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Wallet attestation</text><rect x="620" y="172" width="120" height="70" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="680" y="200.8" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">a new WIA key per</text>
<text x="680" y="213.2" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">transaction</text><line x1="620" y1="207" x2="516" y2="210" stroke="#A8432F" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arr)"/><line x1="750" y1="207" x2="740" y2="207" stroke="#4A4740" stroke-width="1"/><rect x="750" y="316" width="120" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="810" y="326.3" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">The institution's</text>
<text x="810" y="338.7" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">own signature</text>
<text x="810" y="351.0" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">(institution and</text>
<text x="810" y="363.4" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">verifier</text>
<text x="810" y="375.7" font-size="9.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">colluding)</text><rect x="620" y="316" width="120" height="70" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="680" y="338.6" font-size="9.5" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">zero-knowledge</text>
<text x="680" y="351.0" font-size="9.5" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">proof; residual</text>
<text x="680" y="363.3" font-size="9.5" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">risk L3 today</text><line x1="620" y1="351" x2="516" y2="246" stroke="#A8432F" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arr)"/><line x1="750" y1="351" x2="740" y2="351" stroke="#4A4740" stroke-width="1"/><text x="450" y="410.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">No personal data in shared records (lists, logs, ledger): this is not a separate channel but the base of the design.</text>
</svg>
