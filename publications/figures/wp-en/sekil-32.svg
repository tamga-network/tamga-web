<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="420" fill="#FFFFFF"/>
<rect x="20" y="10" width="140" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="90" y="33.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Writer A</text><line x1="90" y1="56" x2="90" y2="380" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="200" y="10" width="140" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="270" y="33.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Writer B</text><line x1="270" y1="56" x2="270" y2="380" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="380" y="10" width="140" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="450" y="33.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Writer C</text><line x1="450" y1="56" x2="450" y2="380" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="630" y="10" width="140" height="46" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="700" y="33.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Ledger</text><line x1="700" y1="56" x2="700" y2="380" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="90" y1="96" x2="698" y2="96" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="335.6" y="79.1" width="118.8" height="15.8" fill="#FFFFFF"/>
<text x="395" y="87.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. X for version 42</text><rect x="714" y="82" width="172" height="28" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/><text x="800" y="96.0" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">candidate 1 (X), support 1</text><line x1="270" y1="160" x2="698" y2="160" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="425.6" y="143.1" width="118.8" height="15.8" fill="#FFFFFF"/>
<text x="485" y="151.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. Y for version 42</text><rect x="714" y="140" width="172" height="44" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="800" y="155.8" font-size="9.5" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">candidate 2 (Y), support 1</text>
<text x="800" y="168.2" font-size="9.5" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">conflict: first X, then Y</text><line x1="450" y1="232" x2="698" y2="232" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="492.3" y="200.8" width="165.4" height="15.8" fill="#FFFFFF"/>
<text x="575" y="208.7" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. computes X from the list</text>
<rect x="518.5" y="215.1" width="112.9" height="15.8" fill="#FFFFFF"/>
<text x="575" y="223.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">it verified itself</text><rect x="714" y="212" width="172" height="44" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="800" y="227.8" font-size="9.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">candidate 1, support 2 = k</text>
<text x="800" y="240.2" font-size="9.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">confirmed; version 42 closed</text><line x1="270" y1="304" x2="698" y2="304" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><rect x="428.5" y="287.1" width="112.9" height="15.8" fill="#FFFFFF"/>
<text x="485" y="295.0" font-size="11" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">4. B submits again</text><rect x="714" y="286" width="172" height="44" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="800" y="301.8" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">rejected: you already backed</text>
<text x="800" y="314.2" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">a candidate for this version</text><rect x="123.2" y="396.4" width="653.5" height="15.1" fill="#FFFFFF"/>
<text x="450" y="404.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">One writer, one candidate · a removed writer's support does not count · an unconfirmed candidate never yields &quot;yes&quot;.</text>
</svg>
