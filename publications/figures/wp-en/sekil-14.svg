<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="676" fill="#FFFFFF"/>
<rect x="7" y="10" width="170" height="46" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="92" y="33.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur</text><line x1="92" y1="56" x2="92" y2="640" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="177" y="10" width="170" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="262" y="33.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Wallet</text><line x1="262" y1="56" x2="262" y2="640" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="405" y="10" width="170" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="490" y="25.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Issuance service</text>
<text x="490" y="40.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(Example University)</text><line x1="490" y1="56" x2="490" y2="640" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="625" y="10" width="170" height="46" rx="6" fill="#F8F6F1" stroke="#4A4740" stroke-width="1.4"/><text x="710" y="25.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Institution's system</text>
<text x="710" y="40.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(authentic source)</text><line x1="710" y1="56" x2="710" y2="640" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="806" y="10" width="92" height="46" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4" stroke-dasharray="6 4"/><text x="852" y="26.5" font-size="10" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">Trust list</text>
<text x="852" y="39.5" font-size="10" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">(prefetched)</text><line x1="852" y1="56" x2="852" y2="640" stroke="#C8A24C" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="710" y1="96" x2="94" y2="96" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="286.2" y="79.1" width="229.5" height="15.8" fill="#FFFFFF"/>
<text x="401" y="87.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. QR code + separate transaction code</text><line x1="262" y1="146" x2="488" y2="146" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="290.4" y="129.1" width="171.2" height="15.8" fill="#FFFFFF"/>
<text x="376" y="137.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. offer and signed metadata</text><line x1="262" y1="160" x2="848" y2="160" stroke="#C8A24C" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arg)"/><rect x="643.1" y="165.2" width="113.7" height="13.7" fill="#FFFFFF"/>
<text x="700" y="172.0" font-size="9.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">is the signer listed?</text><line x1="262" y1="212" x2="488" y2="212" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="255.4" y="180.8" width="241.2" height="15.8" fill="#FFFFFF"/>
<text x="376" y="188.7" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. /token: pre-authorized code + tx code</text>
<rect x="337.0" y="195.1" width="78.0" height="15.8" fill="#FFFFFF"/>
<text x="376" y="203.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">+ DPoP + WIA</text><line x1="490" y1="248" x2="264" y2="248" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><rect x="278.7" y="231.1" width="194.6" height="15.8" fill="#FFFFFF"/>
<text x="376" y="239.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">access token (5 min, DPoP-bound)</text><line x1="262" y1="292" x2="488" y2="292" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="345.8" y="275.1" width="60.5" height="15.8" fill="#FFFFFF"/>
<text x="376" y="283.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. /nonce</text><line x1="490" y1="326" x2="264" y2="326" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><rect x="351.6" y="309.1" width="48.8" height="15.8" fill="#FFFFFF"/>
<text x="376" y="317.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">c_nonce</text><rect x="162" y="347" width="200" height="42" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="262" y="361.2" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. generate 10 keys, get key</text>
<text x="262" y="374.8" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">attestation, sign the proof</text><line x1="262" y1="420" x2="488" y2="420" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="278.7" y="403.1" width="194.6" height="15.8" fill="#FFFFFF"/>
<text x="376" y="411.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">6. /credential: DPoP + key proof</text><rect x="375" y="441" width="230" height="42" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="490" y="455.2" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">7. checks; consume nonce atomically;</text>
<text x="490" y="468.8" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">are WIA and KA listed?</text><line x1="606" y1="462" x2="848" y2="462" stroke="#C8A24C" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arg)"/><line x1="490" y1="512" x2="708" y2="512" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="502.7" y="495.1" width="194.6" height="15.8" fill="#FFFFFF"/>
<text x="600" y="503.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">8. read the data at signing time</text><line x1="710" y1="540" x2="492" y2="540" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><rect x="546.4" y="523.1" width="107.1" height="15.8" fill="#FFFFFF"/>
<text x="600" y="531.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">data (not stored)</text><rect x="360" y="563" width="260" height="42" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="490" y="577.2" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">9. separate cnf and status slot per copy;</text>
<text x="490" y="590.8" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">signed with the institution's key</text><line x1="490" y1="628" x2="264" y2="628" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="331.2" y="611.1" width="89.6" height="15.8" fill="#FFFFFF"/>
<text x="376" y="619.0" font-size="11" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">10. ten copies</text><text x="450" y="662.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Nothing is written to the shared ledger; status slot allocation lives in the issuer's own database.</text>
</svg>
