<rect x="20" y="30" width="260" height="150" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="2.4"/><text x="150" y="82.5" font-size="11" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Source: signed lists + anchor log</text><text x="150" y="100.5" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">list of trusted lists, version n</text><text x="150" y="114.2" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">tl-tr, version n</text><text x="150" y="127.8" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">last line of the log</text><rect x="330" y="66" width="230" height="80" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="445" y="91.0" font-size="10.5" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">List publisher</text><text x="445" y="108.3" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">verifies its own output first, then</text><text x="445" y="121.3" font-size="10" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">sends only digests</text><rect x="610" y="30" width="270" height="150" rx="6" fill="#FFFFFF" stroke="#4A4740" stroke-width="1.4" stroke-dasharray="6 4"/><text x="745" y="75.4" font-size="11" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Derived: shared ledger (not present</text><text x="745" y="89.7" font-size="11" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">today, off)</text><text x="745" y="107.6" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">version, content digest,</text><text x="745" y="121.3" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">previous digest, time</text><text x="745" y="134.9" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">record digests, fingerprints</text><line x1="282" y1="106" x2="326" y2="106" stroke="#1E5A78" stroke-width="3" marker-end="url(#ar)"/><line x1="562" y1="106" x2="606" y2="106" stroke="#1E5A78" stroke-width="3" marker-end="url(#ar)"/><rect x="561.5" y="114.3" width="45.1" height="14.4" fill="#FFFFFF"/>
