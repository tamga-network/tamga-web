<rect x="0" y="0" width="900" height="270" fill="#FFFFFF"/>
<text x="20" y="20.0" font-size="12.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Before</text><line x1="30" y1="80" x2="690" y2="80" stroke="#14120F" stroke-width="1.2"/><rect x="30" y="36" width="154" height="64" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="107" y="61.8" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Nurlan shows the QR (60</text>
<text x="107" y="74.2" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">s token)</text><rect x="198" y="36" width="154" height="64" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="275" y="61.8" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. An attacker takes a</text>
<text x="275" y="74.2" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">photo</text><rect x="366" y="36" width="154" height="64" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="443" y="55.6" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">3. The attacker submits</text>
<text x="443" y="68.0" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">the token: accepted,</text>
<text x="443" y="80.3" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">ticket used up</text><rect x="534" y="36" width="154" height="64" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="611" y="61.8" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">4. Nurlan at the gate:</text>
<text x="611" y="74.2" font-size="9.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">&quot;ticket already used&quot;</text><text x="20" y="160.0" font-size="12.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">After</text><line x1="30" y1="220" x2="690" y2="220" stroke="#14120F" stroke-width="1.2"/><rect x="30" y="176" width="154" height="64" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="107" y="201.8" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Nurlan shows the QR (60</text>
<text x="107" y="214.2" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">s token)</text><rect x="198" y="176" width="154" height="64" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="275" y="201.8" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. An attacker takes a</text>
<text x="275" y="214.2" font-size="9.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">photo</text><rect x="366" y="176" width="154" height="64" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="443" y="195.7" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">3. The request carries no</text>
<text x="443" y="208.0" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">terminal key: the token is</text>
<text x="443" y="220.3" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">left untouched</text><rect x="534" y="176" width="154" height="64" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="611" y="195.7" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">4. The gate submits with</text>
<text x="611" y="208.0" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">the institution's terminal</text>
<text x="611" y="220.3" font-size="9.5" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">key: Nurlan enters</text><rect x="714" y="60" width="170" height="170" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="799" y="119.0" font-size="10" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">The gate group is in the</text>
<text x="799" y="132.0" font-size="10" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">list: institution and</text>
<text x="799" y="145.0" font-size="10" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">allowed policies; if the</text>
<text x="799" y="158.0" font-size="10" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">group leaves the list, the</text>
<text x="799" y="171.0" font-size="10" font-weight="500" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">gate is rejected</text>
