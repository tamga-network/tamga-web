<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="352" fill="#FFFFFF"/>
<rect x="320" y="30" width="260" height="70" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="450" y="65.0" font-size="13" font-weight="700" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">Tamga list of trusted lists</text><text x="450" y="18.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">root fingerprint pinned in the wallet and the verifier</text><rect x="30" y="180" width="220" height="60" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="140" y="202.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Türkiye list</text>
<text x="140" y="217.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(Tamga format)</text><line x1="330" y1="90" x2="200" y2="176" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="160.3" y="116.4" width="119.3" height="15.1" fill="#FFFFFF"/>
<text x="220" y="124.0" font-size="10.5" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">signer: signing_keys</text><rect x="610" y="180" width="270" height="60" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="745" y="202.8" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">External list</text>
<text x="745" y="217.2" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(a state's or the EU's ETSI list)</text><line x1="570" y1="90" x2="700" y2="176" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="686.0" y="98.8" width="45.1" height="14.4" fill="#FFFFFF"/>
<text x="690" y="106.0" font-size="10" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">address</text><rect x="686.0" y="113.8" width="140.5" height="14.4" fill="#FFFFFF"/>
<text x="690" y="121.0" font-size="10" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">pinned signer fingerprint</text><rect x="686.0" y="128.8" width="172.3" height="14.4" fill="#FFFFFF"/>
<text x="690" y="136.0" font-size="10" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">scope: roles + credential types</text><rect x="686.0" y="143.8" width="87.5" height="14.4" fill="#FFFFFF"/>
<text x="690" y="151.0" font-size="10" font-weight="400" fill="#174A63" text-anchor="start" dominant-baseline="middle">approval record</text><rect x="610" y="262" width="130" height="44" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="675" y="284.0" font-size="10.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">in scope: accepted</text><rect x="750" y="262" width="130" height="44" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="815" y="277.5" font-size="10" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">out-of-scope entry:</text>
<text x="815" y="290.5" font-size="10" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">ignored</text><circle cx="300" cy="290" r="14" fill="none" stroke="#4A4740" stroke-width="1.6"/><path d="M300,282 V290 H307" stroke="#4A4740" stroke-width="1.6" fill="none"/><rect x="318.0" y="262.8" width="236.2" height="15.1" fill="#FFFFFF"/>
<text x="322" y="270.4" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">freshness of the external list is tracked</text>
<rect x="318.0" y="276.4" width="236.2" height="15.1" fill="#FFFFFF"/>
<text x="322" y="284.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">separately; if stale, only questions that</text>
<rect x="318.0" y="290.1" width="169.4" height="15.1" fill="#FFFFFF"/>
<text x="322" y="297.7" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">depend on it return &quot;unknown&quot;</text><text x="450" y="340.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Today the list of trusted lists has no external list; each addition is a separate approval.</text>
</svg>
