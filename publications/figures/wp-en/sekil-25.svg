<rect x="0" y="0" width="900" height="326" fill="#FFFFFF"/>
<text x="220" y="22.0" font-size="13" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Classic selective disclosure (mdoc)</text><text x="680" y="22.0" font-size="13" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Zero-knowledge proof (mso_mdoc_zk)</text><text x="220" y="44.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">what the verifier sees</text><text x="680" y="44.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">what the verifier sees</text><rect x="40" y="58" width="360" height="32" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="220" y="74.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">age_over_18 = true</text><rect x="40" y="98" width="360" height="32" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="220" y="114.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">the institution's signature</text><rect x="40" y="138" width="360" height="32" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="220" y="154.0" font-size="10.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">MSO (field digests, validity)</text><rect x="40" y="178" width="360" height="32" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="220" y="194.0" font-size="10.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">public half of the device key</text><rect x="40" y="218" width="360" height="32" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/><text x="220" y="234.0" font-size="10.5" font-weight="500" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">status list position</text><text x="220" y="268.0" font-size="10" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">red: identical across copies or familiar to the institution</text><rect x="500" y="58" width="360" height="32" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="680" y="74.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">age_over_18 = true</text><rect x="500" y="98" width="360" height="32" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="680" y="114.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">issuer (institution key in the list)</text><rect x="500" y="138" width="360" height="32" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="680" y="154.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">credential type: ZK copy</text><rect x="500" y="178" width="360" height="32" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="680" y="194.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">the proof belongs to this session</text><rect x="500" y="222" width="360" height="52" rx="6" fill="#E8F3EC" stroke="#2F7A55" stroke-width="1.4"/><text x="680" y="241.5" font-size="10" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">not visible: signature, MSO, salts, device key,</text>
<text x="680" y="254.5" font-size="10" font-weight="500" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">status position, date of birth</text><line x1="450" y1="30" x2="450" y2="300" stroke="#CFC7B6" stroke-width="1"/><rect x="500" y="286" width="360" height="30" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="680" y="301.0" font-size="10.5" font-weight="600" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">short life instead of revocation: copy lasts at most 24 h</text>
</svg>
