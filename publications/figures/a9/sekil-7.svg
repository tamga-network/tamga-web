<text x="590" y="30.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Nurlan'ın cüzdanı</text>
<text x="590" y="45.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(doğrulayan · okuyucu)</text><line x1="590" y1="62" x2="590" y2="660" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="743" y="14" width="150" height="48" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
