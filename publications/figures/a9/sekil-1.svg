<rect x="0" y="0" width="900" height="420" fill="#FFFFFF"/>
<text x="145" y="22.0" font-size="13" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">Veren imzalı öğeler</text><rect x="20" y="40" width="250" height="70" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="32" y="57.0" font-size="12.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">digestID 0</text><text x="32" y="75.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">random: 8F3C…</text><text x="32" y="91.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">family_name = &quot;…&quot;</text><line x1="272" y1="75" x2="338" y2="111" stroke="#4A4740" stroke-width="1.2" marker-end="url(#arm)"/><rect x="20" y="124" width="250" height="70" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="32" y="141.0" font-size="12.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">digestID 3</text><text x="32" y="159.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">random: 21AB…</text><text x="32" y="175.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">birth_date = &quot;…&quot;</text><line x1="272" y1="159" x2="338" y2="137" stroke="#4A4740" stroke-width="1.2" marker-end="url(#arm)"/><rect x="20" y="208" width="250" height="70" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="32" y="225.0" font-size="12.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">digestID 7</text><text x="32" y="243.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">random: 8798…</text><text x="32" y="259.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">age_over_18 = true</text><line x1="272" y1="243" x2="338" y2="163" stroke="#4A4740" stroke-width="