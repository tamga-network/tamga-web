<text x="302" y="122.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">SHA-256</text><rect x="340" y="40" width="270" height="246" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="352" y="57.0" font-size="12.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Mobil güvenlik nesnesi (MSO)</text><text x="352" y="85.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">valueDigests:</text><text x="352" y="111.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">   0 → 75A1…</text><text x="352" y="137.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">   3 → C92E…</text><text x="352" y="163.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">   7 → 0B4F…</text><text x="352" y="189.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">   … (gönderilmeyenler de)</text><text x="352" y="215.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">deviceKey: telefonun açık anahtarı</text><text x="352" y="241.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">validityInfo: validFrom, validUntil</text><text x="352" y="267.0" font-size="11" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">docType: org.iso.18013.5.1.mDL</text><text x="765" y="22.0" font-size="13" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">Veren tarafı</text><rect x="660" y="36" width="220" height="46" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="770" y="59.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">IACA kökü (veren makam)</text><line x1="770" y1="84" x2="770" y2="108" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="660" y="110" width="220" height="46" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="770" y="133.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Belge imzalayıcı sertifikası</text><line x1="700" y1="158" x2="614" y2="182" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="696.0" y="175.6" width="85.9" height="15.1" fill="#FFFFFF"/>
<text x="700" y="183.2" font-size="10.5" font-weight="400" fill="#8A6A1F" text-anchor="start" dominant-baseline="middle">MSO'yu imzalar</text>
<rect x="696.0" y="189.2" width="74.8" height="15.1" fill="#FFFFFF"/>
<text x="700" y="196.8" font-size="10.5" font-weight="400" fill="#8A6A1F" text-anchor="start" dominant-baseline="middle">(COSE_Sign1)</text><rect x="660" y="300" width="220" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="770" y="321.4" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cihaz imzalı kısım (deviceAuth)</text>
<text x="770" y="335.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">telefonun gizli anahtarıyla, oturum</text>
<text x="770" y="348.7" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">dökümü üzerine imza ya da MAC</text><line x1="612" y1="215" x2="700" y2="296" stroke="#4A4740" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arm)"/><rect x="664.0" y="237.6" width="74.8" height="15.1" fill="#FFFFFF"/>
<text x="668" y="245.2" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">doğrulama bu</text>
<rect x="664.0" y="251.2" width="85.9" height="15.1" fill="#FFFFFF"/>
<text x="668" y="258.8" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">açık anahtarla</text><text x="20" y="400.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">Gönderilmeyen öğelerin yalnızca özeti görünür; rastgele değer, özetten değerin tahmin edilmesini engeller.</text>
