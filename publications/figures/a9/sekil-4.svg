<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="720" fill="#FFFFFF"/>
<rect x="0" y="14" width="180" height="48" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="90" y="38.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur</text><line x1="90" y1="62" x2="90" y2="710" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="320" y="14" width="180" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="410" y="30.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur'un telefonu</text>
<text x="410" y="45.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(mdoc)</text><line x1="410" y1="62" x2="410" y2="710" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="680" y="14" width="180" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="770" y="30.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kiralama okuyucusu</text>
<text x="770" y="45.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(mdoc okuyucu)</text><line x1="770" y1="62" x2="770" y2="710" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="90" y1="96" x2="408" y2="96" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="179.0" y="78.7" width="142.1" height="16.6" fill="#FFFFFF"/>
<text x="250" y="87.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">0. &quot;Ehliyetimi göster&quot;</text><rect x="300" y="117" width="220" height="34" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="410" y="134.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Geçici anahtar çifti üretir (EDeviceKey)</text><line x1="410" y1="190" x2="768" y2="190" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="482.4" y="157.8" width="215.2" height="16.6" fill="#FFFFFF"/>
<text x="590" y="166.1" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. QR kod: mdoc:… (aygıt katılımı:</text>
<rect x="479.3" y="172.7" width="221.3" height="16.6" fill="#FFFFFF"/>
<text x="590" y="181.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">EDeviceKey açık anahtarı, BLE UUID)</text><rect x="655" y="215" width="230" height="50" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="770" y="232.8" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. EReaderKey üretir;</text>
<text x="770" y="247.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ECDH + HKDF → oturum anahtarları</text><line x1="768" y1="298" x2="412" y2="298" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="476.3" y="280.7" width="227.4" height="16.6" fill="#FFFFFF"/>
<text x="590" y="289.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. BLE bağlantısı (işleme özgü UUID)</text><line x1="770" y1="356" x2="412" y2="356" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="464.1" y="323.7" width="251.8" height="16.6" fill="#FFFFFF"/>
<text x="590" y="332.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. SessionEstablishment: EReaderKey açık</text>
<rect x="473.2" y="338.7" width="233.5" height="16.6" fill="#FFFFFF"/>
<text x="590" y="347.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">anahtarı + şifreli istek + readerAuth</text><rect x="285" y="385" width="250" height="50" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="410" y="402.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. Anahtarları türetir, isteği çözer,</text>
<text x="410" y="417.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">okuyucu sertifikasını kontrol eder</text><line x1="410" y1="466" x2="92" y2="466" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="130.2" y="448.7" width="239.6" height="16.6" fill="#FFFFFF"/>
<text x="250" y="457.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">6. Onay ekranı: kim, ne, ne saklanacak</text><line x1="90" y1="506" x2="408" y2="506" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="182.0" y="488.7" width="136.0" height="16.6" fill="#FFFFFF"/>
<text x="250" y="497.0" font-size="11.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">Parmak iziyle onaylar</text><line x1="410" y1="566" x2="768" y2="566" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="470.2" y="533.7" width="239.6" height="16.6" fill="#FFFFFF"/>
<text x="590" y="542.0" font-size="11.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">7. SessionData: şifreli DeviceResponse</text>
<rect x="497.6" y="548.7" width="184.8" height="16.6" fill="#FFFFFF"/>
<text x="590" y="557.0" font-size="11.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">(öğeler + MSO + cihaz kanıtı)</text><rect x="652" y="595" width="236" height="50" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="770" y="612.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">8. MSO imzası, kök sertifika, özetler,</text>
<text x="770" y="627.1" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cihaz kanıtı, geçerlilik; portre</text><line x1="770" y1="682" x2="412" y2="682" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="455.0" y="664.7" width="270.1" height="16.6" fill="#FFFFFF"/>
<text x="590" y="673.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">9. Oturumu kapat (durum 20 ya da BLE &quot;End&quot;)</text><rect x="20" y="560" width="170" height="46" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/>
<text x="105" y="575.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İnternet yok;</text>
<text x="105" y="590.1" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">veren kurum habersiz.</text>
</svg>
