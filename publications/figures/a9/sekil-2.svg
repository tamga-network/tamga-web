<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="268" fill="#FFFFFF"/>
<rect x="20" y="30" width="270" height="170" rx="8" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="34" y="52.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">1. Aygıt katılımı</text><text x="34" y="74.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">kanal: QR kod ya da NFC</text><text x="34" y="102.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Telefon geçici açık anahtarını</text><text x="34" y="122.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">(EDeviceKey) ve bağlantı</text><text x="34" y="142.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">bilgisini verir.</text><text x="34" y="162.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Kısa menzil: tanışma yakında olur.</text><line x1="292" y1="115" x2="313" y2="115" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="315" y="30" width="270" height="170" rx="8" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="329" y="52.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">2. Oturum kurulması</text><text x="329" y="74.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">kanal: seçilen veri yolu</text><text x="329" y="102.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Okuyucu kendi geçici anahtarını</text><text x="329" y="122.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">üretir; iki taraf ECDH ile ortak</text><text x="329" y="142.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">sır, HKDF ile iki oturum</text><text x="329" y="162.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">anahtarı türetir.</text><line x1="587" y1="115" x2="608" y2="115" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="610" y="30" width="270" height="170" rx="8" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="624" y="52.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">3. Veri alma</text><text x="624" y="74.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">kanal: BLE, NFC ya da Wi-Fi Aware</text><text x="624" y="102.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Şifreli istek ve şifreli cevap;</text><text x="624" y="122.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">arada kişinin onayı.</text><text x="624" y="142.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Cevapta veren imzası ve</text><text x="624" y="162.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">telefonun kanıtı.</text><rect x="20" y="220" width="860" height="34" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/>
<text x="450" y="237.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İnternet gerekmez; işlem boyunca veren kurumla hiçbir bağlantı kurulmaz.</text>
</svg>
