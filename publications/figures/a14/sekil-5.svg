<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="570" fill="#FFFFFF"/>
<rect x="20" y="16" width="220" height="48" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="130" y="40.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Telefondaki uygulama</text><rect x="320" y="16" width="220" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="430" y="40.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Belgenin çipi</text><rect x="590" y="16" width="280" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="730" y="32.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulama sunucusu</text>
<text x="730" y="47.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(güvenen taraf)</text><line x1="130" y1="64" x2="130" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="430" y1="64" x2="430" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="730" y1="64" x2="730" y2="560" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="10" y="80" width="300" height="52" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="160" y="98.8" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. MRZ'yi kamerayla okur ya da</text>
<text x="160" y="113.1" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kullanıcı kart erişim numarasını (CAN) girer</text><line x1="130" y1="160" x2="428" y2="160" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="130.1" y="138.5" width="299.8" height="19.0" fill="#FFFFFF"/><text x="280" y="148.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. PACE (eski belgelerde BAC): şifreli oturum</text><line x1="130" y1="195" x2="428" y2="195" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="149.4" y="173.5" width="261.2" height="19.0" fill="#FFFFFF"/><text x="280" y="183.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. DG1, DG2, DG14/DG15 ve EF.SOD okunur</text><line x1="130" y1="240" x2="428" y2="240" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="126.9" y="218.5" width="306.2" height="19.0" fill="#FFFFFF"/><text x="280" y="228.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. Çip ya da aktif doğrulama (sınama ve cevap)</text><line x1="130" y1="300" x2="728" y2="300" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="231.8" y="278.5" width="396.4" height="19.0" fill="#FFFFFF"/><text x="430" y="288.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. Veri grupları, EF.SOD ve çipin cevabı sunucuya gönderilir</text><rect x="580" y="326" width="300" height="52" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="730" y="344.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">6. Pasif doğrulama: özetler, DS imzası,</text>
<text x="730" y="359.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">CSCA zinciri, iptal listesi</text><rect x="580" y="400" width="300" height="52" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="730" y="418.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">7. DG2'deki imzalı portre ile canlılık</text>
<text x="730" y="433.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kontrolünden geçmiş selfie karşılaştırılır</text><text x="420" y="268.0" font-size="11" font-weight="600" fill="#2F7A55" text-anchor="end" dominant-baseline="middle">çip kopya değil</text><rect x="628.4" y="472.5" width="203.2" height="19.0" fill="#FFFFFF"/><text x="730" y="482.0" font-size="11.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">belge gerçek ve değişmemiş (6)</text><rect x="560.8" y="494.5" width="338.4" height="19.0" fill="#FFFFFF"/><text x="730" y="504.0" font-size="11.5" font-weight="600" fill="#8A6A1E" text-anchor="middle" dominant-baseline="middle">kişi belgenin sahibi mi? hâlâ görüntüye dayanır (7)</text><rect x="18.7" y="513.7" width="262.6" height="32.6" fill="#FFFFFF"/><text x="150" y="522.9" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Telefon saldırganın denetiminde olabilir:</text>
<text x="150" y="537.1" font-size="11" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">imzalı veri sunucuda doğrulanır.</text>
</svg>
