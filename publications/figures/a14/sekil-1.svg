<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" width="900" height="365" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="365" fill="#FFFFFF"/>
<text x="20" y="22.0" font-size="13" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">Belge</text><text x="20" y="152.0" font-size="13" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">Kişi</text><rect x="20" y="34" width="170" height="72" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="105" y="55.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Belge fotoğrafı</text>
<text x="105" y="70.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(ön/arka yüz ya da</text>
<text x="105" y="85.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">pasaport sayfası)</text><line x1="192" y1="70" x2="216" y2="70" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="220" y="34" width="200" height="72" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="320" y="55.7" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Belge kontrolleri: şablon,</text>
<text x="320" y="70.0" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">güvenlik öğeleri, MRZ sağlama</text>
<text x="320" y="84.3" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">haneleri, yazı tutarlılığı</text><line x1="422" y1="70" x2="446" y2="70" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="450" y="34" width="150" height="72" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="525" y="62.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Okunan bilgiler</text>
<text x="525" y="77.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">+ belgedeki portre</text><rect x="20" y="164" width="170" height="72" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="105" y="192.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Selfie ya da</text>
<text x="105" y="207.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kısa video</text><line x1="192" y1="200" x2="216" y2="200" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="220" y="164" width="200" height="72" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="320" y="185.1" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Canlılık tespiti:</text>
<text x="320" y="200.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">gerçek ve canlı bir</text>
<text x="320" y="215.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yüz mü?</text><line x1="422" y1="200" x2="446" y2="200" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="450" y="164" width="150" height="72" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="525" y="192.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Canlı yüz</text>
<text x="525" y="207.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">görüntüsü</text><line x1="602" y1="70" x2="640" y2="112" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><line x1="602" y1="200" x2="640" y2="158" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="644" y="98" width="236" height="74" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="762" y="120.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Yüz karşılaştırma: portre ile</text>
<text x="762" y="135.0" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">canlı yüz aynı kişi mi?</text>
<text x="762" y="149.9" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">→ benzerlik puanı</text><line x1="762" y1="174" x2="762" y2="204" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="644" y="208" width="236" height="62" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="762" y="231.8" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Risk sinyalleri: cihaz, ağ,</text>
<text x="762" y="246.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">tekrar eden yüz ya da belge</text><line x1="762" y1="272" x2="762" y2="296" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="644" y="300" width="236" height="50" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="762" y="325.0" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Karar: kabul · ret · insan incelemesi</text><line x1="20" y1="276" x2="610" y2="276" stroke="#CFC7B6" stroke-width="1" stroke-dasharray="5 4"/><text x="20" y="292.2" font-size="12" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle" font-style="italic">Her adım bir görüntüyü yorumlar;</text>
<text x="20" y="307.8" font-size="12" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle" font-style="italic">hiçbiri belgeyi verenin imzasını kontrol etmez.</text>
</svg>
