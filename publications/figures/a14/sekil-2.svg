<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 340" width="910" height="340" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="910" height="340" fill="#FFFFFF"/>
<rect x="20" y="150" width="150" height="76" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="95" y="180.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kameranın önü:</text>
<text x="95" y="195.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yüz ve belge</text><line x1="172" y1="188" x2="198" y2="188" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="200" y="150" width="150" height="76" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="275" y="180.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kamera</text>
<text x="275" y="195.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(donanım)</text><line x1="352" y1="188" x2="378" y2="188" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="380" y="150" width="150" height="76" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="455" y="172.4" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Telefondaki</text>
<text x="455" y="188.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">uygulama ve</text>
<text x="455" y="203.6" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">işletim sistemi</text><line x1="532" y1="188" x2="558" y2="188" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="560" y="150" width="150" height="76" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="635" y="188.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Ağ</text><line x1="712" y1="188" x2="738" y2="188" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="740" y="150" width="150" height="76" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="815" y="180.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulama</text>
<text x="815" y="195.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">sunucusu</text><rect x="20" y="70" width="330" height="54" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.3"/><text x="185" y="89.5" font-size="11.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Canlılık tespiti (PAD)</text>
<text x="185" y="104.5" font-size="11.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">ISO/IEC 30107</text><rect x="380" y="70" width="330" height="54" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.3"/><text x="545" y="89.5" font-size="11.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Enjeksiyon saldırısı tespiti (CEN/TS 18099),</text>
<text x="545" y="104.5" font-size="11.5" font-weight="600" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">cihaz ve uygulama bütünlüğü</text><line x1="185" y1="126" x2="185" y2="146" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><line x1="545" y1="126" x2="545" y2="146" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><rect x="20" y="12" width="690" height="44" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="365" y="34.0" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Belge saldırıları: sahte belge görüntüsü · harmanlanmış (morph) portre · çalıntı gerçek belge</text><path d="M20,246 h150" stroke="#A8432F" stroke-width="2"/><text x="20" y="257.1" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle">Sunum saldırısı (Tip 1):</text>
<text x="20" y="272.0" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle">basılı fotoğraf, ekrandan</text>
<text x="20" y="286.9" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="start" dominant-baseline="middle">video, maske, makyaj</text><path d="M380,246 v8 h330 v-8" fill="none" stroke="#A8432F" stroke-width="2"/><text x="545" y="272.5" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Enjeksiyon saldırısı (Tip 2): sanal kamera, emülatör,</text>
<text x="545" y="287.5" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">değiştirilmiş uygulama, akışın yolda değiştirilmesi</text><text x="545" y="322.0" font-size="11.5" font-weight="600" fill="#A8432F" text-anchor="middle" dominant-baseline="middle" font-style="italic">Görüntü hiçbir fiziksel ortamdan geçmez.</text><text x="185" y="322.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Taklit gerçek kameranın önünden geçer.</text>
</svg>
