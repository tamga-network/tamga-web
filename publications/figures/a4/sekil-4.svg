<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="380" fill="#FFFFFF"/>
<text x="210" y="24.0" font-size="15" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">Etkileşimli</text><text x="660" y="24.0" font-size="15" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">Etkileşimsiz (Fiat-Shamir)</text><line x1="430" y1="10" x2="430" y2="400" stroke="#CFC7B6" stroke-width="1.2"/><rect x="20" y="50" width="130" height="46" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="85" y="73.0" font-size="13" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur</text><rect x="270" y="50" width="130" height="46" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="335" y="73.0" font-size="13" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Timur</text><line x1="85" y1="96" x2="85" y2="300" stroke="#CFC7B6" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="335" y1="96" x2="335" y2="300" stroke="#CFC7B6" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="85" y1="140" x2="333" y2="140" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="210" y="126.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">taahhüt</text><line x1="335" y1="200" x2="87" y2="200" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="210" y="186.0" font-size="12" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">meydan okuma</text><text x="210" y="216.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">(Timur'un rastgele sayısı)</text><line x1="85" y1="260" x2="333" y2="260" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="210" y="246.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cevap</text><text x="210" y="332.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">İki taraf aynı anda çevrimiçi olmalı;</text>
<text x="210" y="347.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">kayıt başkasına kanıt olmaz.</text><rect x="455" y="48" width="250" height="262" rx="8" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="580" y="66.0" font-size="11.5" font-weight="600" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Aynur kendi başına hesaplar</text><rect x="480" y="82" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="580" y="94.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">taahhüt + ifade +</text>
<text x="580" y="109.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">oturum bilgisi</text><line x1="580" y1="123" x2="580" y2="136" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="480" y="138" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="580" y="158.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">özet fonksiyonu</text><line x1="580" y1="179" x2="580" y2="192" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="480" y="194" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="580" y="214.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">meydan okuma</text><line x1="580" y1="235" x2="580" y2="248" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="480" y="250" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="580" y="270.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">cevap</text><rect x="778" y="140" width="110" height="60" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="833" y="170.0" font-size="13" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Timur</text><line x1="709" y1="170" x2="776" y2="170" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="742" y="156.0" font-size="10.5" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle">tek mesaj</text><text x="833" y="214.8" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ispat =</text>
<text x="833" y="229.2" font-size="11" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">taahhüt + cevap</text><text x="833" y="255.2" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">aynı özeti kendisi</text>
<text x="833" y="268.8" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">hesaplar, kontrol eder</text><text x="665" y="332.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Tek mesaj; herkes sonradan doğrulayabilir. İspatı bu</text>
<text x="665" y="347.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">oturuma bağlamak için oturum bilgisi özete katılır.</text>
</svg>
