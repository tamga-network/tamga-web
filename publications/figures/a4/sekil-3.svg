<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900" height="458" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="458" fill="#FFFFFF"/>
<rect x="30" y="18" width="240" height="52" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="150" y="35.9" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Aynur (ispatçı)</text>
<text x="150" y="52.1" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">gizli anahtarı bilir</text><rect x="400" y="18" width="240" height="52" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="520" y="35.9" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Timur (doğrulayıcı)</text>
<text x="520" y="52.1" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yalnız açık anahtarı bilir</text><line x1="150" y1="70" x2="150" y2="400" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="520" y1="70" x2="520" y2="400" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="775" y="44.0" font-size="12.5" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">Mağarada karşılığı</text><line x1="150" y1="120" x2="518" y2="120" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="335" y="106.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Taahhüt</text><text x="335" y="135.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">rastgele sayıdan türetilmiş bir değer</text><rect x="670" y="102" width="210" height="36" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/>
<text x="775" y="120.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">“bir koridora gir”</text><line x1="520" y1="195" x2="152" y2="195" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="335" y="181.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. Meydan okuma</text><text x="335" y="210.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">rastgele bir sayı</text><rect x="670" y="177" width="210" height="36" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/>
<text x="775" y="195.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">“B'den çık!”</text><line x1="150" y1="270" x2="518" y2="270" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><text x="335" y="256.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. Cevap</text><text x="335" y="285.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">gizli anahtar + rastgele sayı + meydan okuma</text><rect x="670" y="252" width="210" height="36" rx="6" fill="#F8F6F1" stroke="#CFC7B6" stroke-width="1.4"/>
<text x="775" y="270.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">“istenen koridordan çık”</text><rect x="370" y="312" width="300" height="58" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="520" y="333.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. Kontrol: açık anahtar, taahhüt, meydan</text>
<text x="520" y="348.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">okuma ve cevapla eşitlik tutuyor mu?</text><rect x="30" y="400" width="300" height="40" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="180" y="420.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Gizli anahtar hiç gönderilmez</text><rect x="400" y="400" width="360" height="40" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="580" y="420.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Meydan okuma taahhütten sonra gelmeli</text>
</svg>
