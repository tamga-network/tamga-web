<text x="770" y="68.8" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(güven listesinden)</text><rect x="670" y="90" width="200" height="44" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
