<text x="545" y="233.2" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">+ age_over_18 = evet</text><rect x="650" y="222" width="220" height="52" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
