<text x="770" y="162.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Oturum değeri (nonce)</text><line x1="760" y1="186" x2="760" y2="220" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="20" y="368" width="425" height="46" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="232.5" y="383.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayıcının görmediği: doğum tarihi, ad, MSO,</text>
<text x="232.5" y="398.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kurum imzası, tuzlar, cihaz anahtarı</text><rect x="455" y="368" width="425" height="46" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="667.5" y="383.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayıcının gördüğü: 18 yaşından büyük; ispat</text>
<text x="667.5" y="398.5" font-size="11.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">bu oturuma ait; belge güvenilir bir kurumdan</text>
</svg>
