<rect x="0" y="0" width="900" height="426" fill="#FFFFFF"/>
<text x="110" y="22.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">Veren kurum</text><text x="345" y="22.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">Kişinin telefonu</text><text x="760" y="22.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="middle" dominant-baseline="middle">Doğrulayıcı</text><text x="110" y="40.0" font-size="10.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">(değişiklik yok)</text><rect x="20" y="56" width="180" height="92" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
