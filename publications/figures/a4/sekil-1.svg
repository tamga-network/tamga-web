<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" width="900" height="418" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="418" fill="#FFFFFF"/>
<rect x="20" y="18" width="270" height="44" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="155" y="40.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Kimlik kartının tamamı</text><text x="155" y="84.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Doğrulayıcının gördüğü</text><rect x="20" y="98" width="270" height="175" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.2"/><circle cx="40" cy="124" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="52" y="124.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Ad, soyad</text><circle cx="40" cy="151" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="52" y="151.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Doğum tarihi</text><circle cx="40" cy="178" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="52" y="178.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Kimlik numarası</text><circle cx="40" cy="205" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="52" y="205.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Uyruk</text><circle cx="40" cy="232" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="52" y="232.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Fotoğraf</text><circle cx="40" cy="259" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="52" y="259.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Kartın geçerlilik tarihi</text><line x1="155" y1="276" x2="155" y2="298" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><rect x="20" y="302" width="270" height="74" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="155" y="331.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Gerekenden çok</text>
<text x="155" y="346.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">fazla bilgi</text><rect x="315" y="18" width="270" height="44" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="450" y="40.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Seçici açıklama</text><text x="450" y="84.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Doğrulayıcının gördüğü</text><rect x="315" y="98" width="270" height="175" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.2"/><circle cx="335" cy="124" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="347" y="124.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">18 yaşından büyük: evet</text><circle cx="335" cy="151" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="347" y="151.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Veren kurumun imzası</text><circle cx="335" cy="178" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="347" y="178.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Cüzdan anahtarı (açık yarısı)</text><line x1="450" y1="276" x2="450" y2="298" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><rect x="315" y="302" width="270" height="74" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="450" y="323.4" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Yalnız gereken alan; ama imza ve anahtar</text>
<text x="450" y="339.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">her gösterimde aynıysa siteler</text>
<text x="450" y="354.6" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kişiyi eşleştirebilir</text><rect x="610" y="18" width="270" height="44" rx="6" fill="#1E5A78" stroke="#1E5A78" stroke-width="1.4"/>
<text x="745" y="40.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Sıfır bilgi ispatı</text><text x="745" y="84.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Doğrulayıcının gördüğü</text><rect x="610" y="98" width="270" height="175" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.2"/><circle cx="630" cy="124" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="642" y="124.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">18 yaşından büyük: evet</text><circle cx="630" cy="151" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="642" y="151.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">Güvenilir bir kurumun geçerli</text><circle cx="630" cy="178" r="3.2" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="642" y="178.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">belgesine dayanıyor</text><line x1="745" y1="276" x2="745" y2="298" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><rect x="610" y="302" width="270" height="74" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="745" y="323.4" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İspat her seferinde yeni;</text>
<text x="745" y="339.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">iki ispat birbirine</text>
<text x="745" y="354.6" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">bağlanamaz</text><text x="450" y="402.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Sağa doğru doğrulayıcının gördüğü bilgi azalır; sonuç (“18 yaşından büyük”) aynı kalır.</text>
</svg>
