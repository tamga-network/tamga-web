<text x="490" y="127.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Kurum imzası doğru mu?</text><rect x="360" y="162" width="260" height="46" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="490" y="185.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. Yaş alanı “doğru” mu?</text><rect x="360" y="220" width="260" height="46" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="490" y="243.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">3. Belgenin süresi dolmamış mı?</text><rect x="360" y="278" width="260" height="46" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="490" y="293.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. Cihaz anahtarı bu oturumu</text>
<text x="490" y="308.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">imzalamış mı?</text><rect x="360" y="336" width="260" height="46" rx="6" fill="#FFFFFF" stroke="#1E5A78" stroke-width="1.4"/>
<text x="490" y="359.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. Hepsi evet mi?</text><line x1="642" y1="235" x2="712" y2="235" stroke="#1E5A78" stroke-width="2" marker-end="url(#ar)"/><rect x="714" y="210" width="70" height="50" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="749" y="226.6" font-size="13" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">evet</text>
<text x="749" y="243.5" font-size="13" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(1)</text><rect x="670" y="300" width="215" height="96" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="777.5" y="333.1" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">İspat: “Bu devreyi evet</text>
<text x="777.5" y="348.0" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">diyecek biçimde çalıştıran</text>
<text x="777.5" y="362.9" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">gizli girdiler biliyorum.”</text><line x1="749" y1="262" x2="776" y2="298" stroke="#4A4740" stroke-width="1.6" marker-end="url(#arm)"/><text x="490" y="440.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Gizli tanığın hiçbiri devreden dışarı çıkmaz.</text>
