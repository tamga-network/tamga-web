ont-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">≈ 1/1.000</text><text x="530" y="299.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="end" dominant-baseline="middle">20 tur</text><rect x="540" y="288" width="20.93023255813954" height="22" rx="3" fill="#2F7A55" opacity="0.85"/><text x="568.9302325581396" y="299.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">≈ 1/1.000.000</text><text x="690" y="352.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Timur her turda yalnız Aynur'un hangi</text>
