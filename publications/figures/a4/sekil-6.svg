<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="358" fill="#FFFFFF"/>
<text x="20" y="28.0" font-size="13.5" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">Yol 1: imzayı değiştir (ör. BBS)</text><rect x="20" y="44" width="250" height="70" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="145" y="71.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kurum: yeni imza türü,</text>
<text x="145" y="86.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yeni anahtar, yeni donanım</text><text x="145" y="132.0" font-size="10.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle" font-style="italic">kurumun altyapısı değişir</text><line x1="272" y1="79" x2="318" y2="79" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="320" y="44" width="250" height="70" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="445" y="71.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdan: kurumun imzasından</text>
<text x="445" y="86.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">türetilmiş ispat</text><line x1="572" y1="79" x2="618" y2="79" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="620" y="44" width="120" height="70" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="680" y="79.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayıcı</text><rect x="758" y="46" width="132" height="66" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="824" y="71.8" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ispat küçük</text>
<text x="824" y="86.1" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ve hızlı</text><text x="20" y="188.0" font-size="13.5" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">Yol 2: imzayı devrede doğrula (ör. Longfellow)</text><rect x="20" y="204" width="250" height="70" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="145" y="231.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kurum: bugünkü ECDSA imzası,</text>
<text x="145" y="246.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">değişiklik yok</text><text x="145" y="292.0" font-size="10.5" font-weight="400" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle" font-style="italic">kurum hiçbir şey değiştirmez</text><line x1="272" y1="239" x2="318" y2="239" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="320" y="204" width="250" height="70" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="445" y="231.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Cüzdan: imzayı devre içinde</text>
<text x="445" y="246.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">doğrular ve ispat üretir</text><line x1="572" y1="239" x2="618" y2="239" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="620" y="204" width="120" height="70" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="680" y="239.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayıcı</text><rect x="758" y="206" width="132" height="66" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="824" y="224.7" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ispat büyük (yüzlerce</text>
<text x="824" y="239.0" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kilobayt), telefonda</text>
<text x="824" y="253.3" font-size="11" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">saniyeler</text><text x="450" y="340.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">AB'nin teknik şartnamelerinde iki yol için ayrı belgeler var: çoklu ileti imzaları ve aritmetik devreler.</text>
</svg>
