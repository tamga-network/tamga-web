<text x="445" y="205.0" font-size="11.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">2. İşlem kodu ayrı kanaldan (e-posta: 4 hane)</text><line x1="90" y1="262" x2="298" y2="262" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="151.4" y="244.7" width="87.2" height="16.6" fill="#FFFFFF"/>
