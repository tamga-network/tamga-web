<text x="410" y="295.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. Yetkilendirme kodu</text><line x1="280" y1="360" x2="538" y2="360" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="339.0" y="327.7" width="142.1" height="16.6" fill="#FFFFFF"/>
