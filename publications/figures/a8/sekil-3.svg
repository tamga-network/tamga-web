<text x="410" y="351.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">+ DPoP kanıtı</text><line x1="540" y1="416" x2="282" y2="416" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="275.0" y="398.7" width="270.1" height="16.6" fill="#FFFFFF"/>
<text x="410" y="407.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">7. Erişim belirteci (DPoP anahtarına bağlı)</text><line x1="280" y1="516" x2="798" y2="516" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="447.6" y="498.7" width="184.8" height="16.6" fill="#FFFFFF"/>
<text x="540" y="507.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">8. Nonce iste; cevap: c_nonce</text><line x1="280" y1="560" x2="798" y2="560" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="347.1" y="542.7" width="385.9" height="16.6" fill="#FFFFFF"/>
<text x="540" y="551.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">9. Belge isteği: erişim belirteci + anahtar kanıtı (proof JWT)</text><line x1="800" y1="604" x2="282" y2="604" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="438.5" y="586.7" width="203.0" height="16.6" fill="#FFFFFF"/>
<text x="540" y="595.0" font-size="11.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">10. Belge (SD-JWT VC ya da mdoc)</text>
