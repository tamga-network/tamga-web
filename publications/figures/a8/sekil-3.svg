<text x="540" y="91.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. Belge teklifi (QR kod; isteğe bağlı, cüzdan da başlatabilir)</text><line x1="280" y1="146" x2="798" y2="146" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="362.3" y="128.7" width="355.4" height="16.6" fill="#FFFFFF"/>
