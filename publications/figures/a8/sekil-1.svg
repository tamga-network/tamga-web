<rect x="20" y="20" width="580" height="64" rx="8" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="40" y="40.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Profil</text><text x="40" y="64.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">HAIP · ETSI TS 119 472-2 / 119 472-3</text><text x="625" y="52.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">Hangi seçenekler zorunlu, hangileri yasak?</text><line x1="310" y1="84" x2="310" y2="96" stroke="#4A4740" stroke-width="1.2" marker-end="url(#arm)"/><rect x="20" y="98" width="580" height="64" rx="8" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="40" y="118.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Cüzdanın çağrılması</text><text x="40" y="142.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">QR kod · bağlantı şeması · Digital Credentials API · yüz yüze NFC / BLE</text><text x="625" y="130.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">Kurum cüzdana nasıl ulaşır?</text><line x1="310" y1="162" x2="310" y2="174" stroke="#4A4740" stroke-width="1.2" marker-end="url(#arm)"/><rect x="20" y="176" width="580" height="64" rx="8" fill="#D6E6EE" stroke="#1E5A78" stroke-width="1.4"/><text x="40" y="196.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Protokol</text><text x="40" y="220.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">OpenID4VCI (verme) · OpenID4VP (gösterme) · DCQL (sorgu)</text><text x="625" y="208.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">Kim kime hangi sırayla ne gönderir?</text><line x1="310" y1="240" x2="310" y2="252" stroke="#4A4740" stroke-width="1.2" marker-end="url(#arm)"/><rect x="20" y="254" width="580" height="64" rx="8" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="40" y="274.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">Belge biçimi</text><text x="40" y="298.0" font-size="12" font-weight="400" fill="#14120F" text-anchor="start" dominant-baseline="middle">SD-JWT VC · mdoc (ISO/IEC 18013-5) · W3C VC</text><text x="625" y="286.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">Belgenin kendisi nasıl kodlanır?</text><line x1="612" y1="30" x2="612" y2="316" stroke="#CFC7B6" stroke-width="1"/><text x="860" y="352.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">Alt katmanlar birbirinden bağımsızdır: aynı protokol farklı biçimleri taşıyabilir.</text>
