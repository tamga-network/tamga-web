<text x="800" y="38.0" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Telefondaki cüzdan</text><line x1="800" y1="62" x2="800" y2="600" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="86" y1="96" x2="268" y2="96" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="94.8" y="78.7" width="166.5" height="16.6" fill="#FFFFFF"/>
<text x="178" y="87.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">1. &quot;Öğrenciliğimi kanıtla&quot;</text><line x1="530" y1="146" x2="272" y2="146" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="292.4" y="128.7" width="215.2" height="16.6" fill="#FFFFFF"/>
<text x="400" y="137.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">2. QR kod: client_id + request_uri</text><line x1="86" y1="196" x2="798" y2="196" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><rect x="359.8" y="178.7" width="166.5" height="16.6" fill="#FFFFFF"/>
<text x="443" y="187.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">3. QR kodu cüzdanla okutur</text><line x1="800" y1="246" x2="532" y2="246" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="572.6" y="228.7" width="184.8" height="16.6" fill="#FFFFFF"/>
<text x="665" y="237.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">4. İsteği indir (request_uri)</text><line x1="530" y1="304" x2="798" y2="304" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="554.3" y="271.7" width="221.3" height="16.6" fill="#FFFFFF"/>
<text x="665" y="280.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">5. İmzalı istek (JAR): DCQL, nonce,</text>
<rect x="563.5" y="286.7" width="203.0" height="16.6" fill="#FFFFFF"/>
<text x="665" y="295.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">response_uri, şifreleme anahtarı</text><rect x="716" y="336" width="168" height="52" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="800" y="354.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">6. İmza + sertifika</text>
<text x="800" y="369.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kontrolü; Aynur onaylar</text><line x1="800" y1="428" x2="532" y2="428" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="603.1" y="395.7" width="123.8" height="16.6" fill="#FFFFFF"/>
<text x="665" y="404.0" font-size="11.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">7. direct_post.jwt:</text>
<rect x="587.9" y="410.7" width="154.3" height="16.6" fill="#FFFFFF"/>
<text x="665" y="419.0" font-size="11.5" font-weight="400" fill="#8A6A1F" text-anchor="middle" dominant-baseline="middle">şifreli vp_token + state</text><rect x="432" y="464" width="196" height="52" rx="6" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/>
<text x="530" y="482.9" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">8. İmza, güven listesi, durum</text>
<text x="530" y="497.2" font-size="11" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">listesi, KB-JWT kontrolleri</text><line x1="530" y1="560" x2="272" y2="560" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="301.5" y="542.7" width="196.9" height="16.6" fill="#FFFFFF"/>
<text x="400" y="551.0" font-size="11.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">9. &quot;Doğrulandı&quot; (sayfa ilerler)</text><rect x="30" y="210" width="190" height="58" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="125" y="225.3" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Sahte bir sayfa da</text>
<text x="125" y="239.0" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">aynı QR kodu gösterebilir</text>
<text x="125" y="252.7" font-size="10.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(Bölüm 5.7).</text>
