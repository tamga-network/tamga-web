<text x="270" y="30.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Bilgisayardaki</text>
<text x="270" y="45.8" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">tarayıcı</text><line x1="270" y1="62" x2="270" y2="600" stroke="#CFC7B6" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="450" y="14" width="160" height="48" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/>
<text x="530" y="30.2" font-size="12" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Doğrulayan sunucusu</text>
