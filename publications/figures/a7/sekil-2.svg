<text x="215" y="120.0" font-size="15" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Geçerli</text><rect x="450" y="20" width="170" height="60" rx="6" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/>
<text x="535" y="50.0" font-size="15" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Askıda</text><line x1="302" y1="105" x2="448" y2="60" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="370" y="64.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">askıya al</text><line x1="448" y1="75" x2="302" y2="120" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><text x="390" y="113.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">askıyı kaldır</text><rect x="700" y="120" width="170" height="60" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="785" y="150.0" font-size="15" font-weight="700" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">İptal edildi</text><text x="785" y="198.0" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle" font-style="italic">kalıcı, geri dönüş yok</text><line x1="302" y1="140" x2="698" y2="150" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><rect x="469.2" y="134.5" width="61.5" height="21.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="500" y="145.0" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">iptal et</text><line x1="622" y1="60" x2="720" y2="118" stroke="#A8432F" stroke-width="1.6" marker-end="url(#arr)"/><text x="690" y="76.0" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">iptal et</text><rect x="130" y="250" width="170" height="56" rx="6" fill="#F8F6F1" stroke="#4A4740" stroke-width="1.4"/>
<text x="215" y="278.0" font-size="14" font-weight="700" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">Süresi doldu</text><line x1="215" y1="152" x2="215" y2="248" stroke="#4A4740" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arm)"/><text x="225" y="192.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">son geçerlilik tarihi geçti</text>
<text x="225" y="207.5" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">(kimse karar vermez)</text><text x="880" y="274.4" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">Süre dolması belgenin içinden;</text>
<text x="880" y="290.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">iptal ve askı belgenin dışındaki</text>
<text x="880" y="305.6" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">durum bilgisinden öğrenilir.</text>
