<text x="762" y="183.8" font-size="12" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">(ortak dizin)</text><text x="762" y="226.5" font-size="11.5" font-weight="400" fill="#A8432F" text-anchor="middle" dominant-baseline="middle" font-style="italic">kurumsal ve hukuki bir soru:</text>
