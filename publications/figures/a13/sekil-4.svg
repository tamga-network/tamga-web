<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" width="900" height="378" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="378" fill="#FFFFFF"/>
<text x="365" y="22.0" font-size="14" font-weight="700" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Bugün</text><text x="705" y="22.0" font-size="14" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Ortak güven altyapısıyla</text><circle cx="52" cy="71.4" r="8.1" fill="#C8A24C"/>
<path d="M37.6,100.2 Q37.6,82.2 52,82.2 Q66.4,82.2 66.4,100.2 z" fill="#C8A24C"/><text x="90" y="70.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Aynur</text><text x="90" y="92.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">Bakü → İstanbul · eğitim</text><rect x="250" y="48" width="230" height="72" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="365" y="76.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">taranmış diploma, noter, apostil,</text>
<text x="365" y="91.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">posta; haftalar</text><line x1="484" y1="84" x2="586" y2="84" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="590" y="48" width="290" height="72" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="735" y="76.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">imzalı diploma cüzdanda; anahtar</text>
<text x="735" y="91.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Azerbaycan'ın listesinden</text><circle cx="52" cy="175.4" r="8.1" fill="#C8A24C"/>
<path d="M37.6,204.2 Q37.6,186.2 52,186.2 Q66.4,186.2 66.4,204.2 z" fill="#C8A24C"/><text x="90" y="174.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Timur</text><text x="90" y="196.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">Almatı → İstanbul · iş</text><rect x="250" y="152" width="230" height="72" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="365" y="180.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">pasaport fotokopisi ve onaylı</text>
<text x="365" y="195.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">diploma sureti</text><line x1="484" y1="188" x2="586" y2="188" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="590" y="152" width="290" height="72" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="735" y="180.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yalnız istenen alanlar; imzalar</text>
<text x="735" y="195.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Kazakistan'ın listesinden</text><circle cx="52" cy="279.4" r="8.1" fill="#C8A24C"/>
<path d="M37.6,308.2 Q37.6,290.2 52,290.2 Q66.4,290.2 66.4,308.2 z" fill="#C8A24C"/><text x="90" y="278.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Dilnoza</text><text x="90" y="300.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle">Taşkent → Bişkek · kayıt</text><rect x="250" y="256" width="230" height="72" rx="6" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.4"/>
<text x="365" y="284.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">pasaport fotokopisi;</text>
<text x="365" y="299.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">gerekenden fazla bilgi</text><line x1="484" y1="292" x2="586" y2="292" stroke="#C8A24C" stroke-width="1.6" marker-end="url(#arg)"/><rect x="590" y="256" width="290" height="72" rx="6" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.4"/>
<text x="735" y="284.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yalnız ad ya da yaş bilgisi;</text>
<text x="735" y="299.5" font-size="11.5" font-weight="500" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kopya yok</text><text x="450" y="362.0" font-size="12" font-weight="600" fill="#174A63" text-anchor="middle" dominant-baseline="middle" font-style="italic">Üç senaryoda aynı soru: Yabancı bir kurumun imzasına neye dayanarak güvenilir?</text>
</svg>
