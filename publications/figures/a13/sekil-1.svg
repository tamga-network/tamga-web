<rect x="0" y="0" width="900" height="412" fill="#FFFFFF"/>
<rect x="150" y="20" width="600" height="50" rx="6" fill="#FFFFFF" stroke="#C8A24C" stroke-width="2" stroke-dasharray="6 4"/><text x="170" y="45.0" font-size="14" font-weight="700" fill="#C8A24C" text-anchor="start" dominant-baseline="middle">6</text><text x="198" y="45.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Sınır ötesi tanıma</text><text x="732" y="45.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">henüz büyük ölçüde boş</text><rect x="150" y="80" width="600" height="50" rx="6" fill="#E3EEF3" stroke="#1E5A78" stroke-width="1.4"/><text x="170" y="105.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">5</text><text x="198" y="105.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Mobil dijital belgeler</text><text x="732" y="105.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">uygulamada kimlik, ehliyet, diğer belgeler</text><rect x="150" y="140" width="600" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="170" y="165.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">4</text><text x="198" y="165.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">E-devlet kapısı</text><text x="732" y="165.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">tek giriş noktası, kamu hizmetleri</text><rect x="150" y="200" width="600" height="50" rx="6" fill="#E3EEF3" stroke="#1E5A78" stroke-width="1.4"/><text x="170" y="225.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">3</text><text x="198" y="225.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Elektronik kimlik doğrulama</text><text x="732" y="225.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">e-imza, mobil imza, kartla giriş</text><rect x="150" y="260" width="600" height="50" rx="6" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><text x="170" y="285.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">2</text><text x="198" y="285.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Fiziksel kimlik belgesi</text><text x="732" y="285.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">çipli kimlik kartı, biyometrik pasaport</text><rect x="150" y="320" width="600" height="50" rx="6" fill="#D6E6EE" stroke="#1E5A78" stroke-width="1.4"/><text x="170" y="345.0" font-size="14" font-weight="700" fill="#1E5A78" text-anchor="start" dominant-baseline="middle">1</text><text x="198" y="345.0" font-size="13.5" font-weight="700" fill="#14120F" text-anchor="start" dominant-baseline="middle">Nüfus kaydı</text><text x="732" y="345.0" font-size="12" font-weight="400" fill="#4A4740" text-anchor="end" dominant-baseline="middle" font-style="italic">kim var, kimlik numarası</text><rect x="20" y="20" width="112" height="350" rx="8" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="76" y="195" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 76 195)">Hukuki çerçeve: e-imza ve kişisel veri kanunları</text><rect x="768" y="20" width="112" height="350" rx="8" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="824" y="195" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 824 195)">Birlikte çalışabilirlik: kurumlar arası veri değişimi</text><text x="450" y="394.0" font-size="11.5" font-weight="400" fill="#4A4740" text-anchor="middle" dominant-baseline="middle" font-style="italic">Katmanlar alttan üste birbirinin üzerine kurulur; en üst katman bu yazının konusudur.</text>
</svg>
