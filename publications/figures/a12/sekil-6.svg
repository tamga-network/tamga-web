<text x="94" y="347.1" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="start" dominant-baseline="middle">izleyiciler sağlayabilir mi?</text><line x1="472" y1="339" x2="598" y2="339" stroke="#1E5A78" stroke-width="1.6" marker-end="url(#ar)"/><rect x="517.8" y="318.7" width="32.4" height="16.6" fill="#FFFFFF"/>
