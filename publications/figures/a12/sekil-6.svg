<text x="265" y="387.0" font-size="11.5" font-weight="700" fill="#174A63" text-anchor="start" dominant-baseline="middle">hayır</text><rect x="40" y="404" width="430" height="62" rx="14" fill="#FFFFFF" stroke="#14120F" stroke-width="1.4"/><circle cx="64" cy="435" r="15" fill="#1E5A78" stroke="none" stroke-width="1"/><text x="64" y="435.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">S5</text><text x="94" y="426.9" font-size="12.5" font-weight="500" fill="#14120F" text-anchor="start" dominant-baseline="middle">Tanıklığı birlikte yürütecek, birbirinden</text>
