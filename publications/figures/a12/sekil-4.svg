<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="IBM Plex Sans">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5A78"/></marker>
  <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4740"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8432F"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8A24C"/></marker>
</defs>
<rect x="0" y="0" width="900" height="390" fill="#FFFFFF"/>
<rect x="20" y="16" width="420" height="300" rx="8" fill="#F8ECE8" stroke="#A8432F" stroke-width="1.8"/><text x="230" y="42.0" font-size="15" font-weight="700" fill="#A8432F" text-anchor="middle" dominant-baseline="middle">Zincire yazılmamalı</text><rect x="460" y="16" width="420" height="300" rx="8" fill="#EAF4EE" stroke="#2F7A55" stroke-width="1.8"/><text x="670" y="42.0" font-size="15" font-weight="700" fill="#2F7A55" text-anchor="middle" dominant-baseline="middle">Zincire yazılabilir</text><rect x="40" y="62" width="380" height="66" rx="8" fill="#FFFFFF" stroke="#A8432F" stroke-width="1.4"/><path d="M57,86 L75,104 M75,86 L57,104" stroke="#A8432F" stroke-width="3" stroke-linecap="round"/><text x="90" y="73.9" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Kişinin verisi</text>
<text x="90" y="90.1" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">(ad, doğum tarihi, diploma)</text><text x="90" y="114.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">silinemez; herkese kopyalanır</text><rect x="40" y="144" width="380" height="66" rx="8" fill="#FFFFFF" stroke="#A8432F" stroke-width="1.4"/><path d="M57,168 L75,186 M75,168 L57,186" stroke="#A8432F" stroke-width="3" stroke-linecap="round"/><text x="90" y="168.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Verinin tuzsuz özeti</text><text x="90" y="196.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">olası değerler denenerek geri bulunur</text><rect x="40" y="226" width="380" height="66" rx="8" fill="#FFFFFF" stroke="#C8A24C" stroke-width="1.4"/><text x="66" y="260.0" font-size="22" font-weight="700" fill="#C8A24C" text-anchor="middle" dominant-baseline="middle">!</text><text x="90" y="237.9" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Kişiye özgü tanımlayıcı</text>
<text x="90" y="254.1" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">ya da tuzlu özet</text><text x="90" y="278.0" font-size="11" font-weight="400" fill="#4A4740" text-anchor="start" dominant-baseline="middle" font-style="italic">silinebilir ama işlemleri birbirine bağlar</text><rect x="480" y="62" width="380" height="48" rx="8" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><path d="M498,86 L504,92 L515,79" stroke="#2F7A55" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="86.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Güven listesi sürümünün özeti</text><rect x="480" y="124" width="380" height="48" rx="8" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><path d="M498,148 L504,154 L515,141" stroke="#2F7A55" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="148.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">İptal listesi yayınının özeti</text><rect x="480" y="186" width="380" height="48" rx="8" fill="#FFFFFF" stroke="#2F7A55" stroke-width="1.4"/><path d="M498,210 L504,216 L515,203" stroke="#2F7A55" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="210.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="start" dominant-baseline="middle">Belge şeması değişikliğinin özeti</text><text x="670" y="262.2" font-size="12" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle" font-style="italic">Hepsi kurumların herkese açık</text>
<text x="670" y="277.8" font-size="12" font-weight="400" fill="#174A63" text-anchor="middle" dominant-baseline="middle" font-style="italic">yayınlarıdır; kimseyi tanımlamaz.</text><rect x="150" y="334" width="600" height="40" rx="8" fill="#F8F6F1" stroke="#14120F" stroke-width="1.4"/><text x="450" y="354.0" font-size="13" font-weight="700" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Güvenli kural: Zincire kişiye ilişkin hiçbir şey yazılmaz, özeti bile.</text>
</svg>
