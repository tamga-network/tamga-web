ddle" dominant-baseline="middle">did:web</text><line x1="331" y1="110" x2="569" y2="110" stroke="#D6E6EE" stroke-width="1.4"/><text x="450" y="132.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Belge alan adı altında</text><text x="450" y="150.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">yayımlanır</text><text x="450" y="178.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Güven: alan adı</text><text x="450" y="196.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">ve TLS sertifikası</text><text x="450" y="224.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Sunucu sahibi belgeyi</text><text x="450" y="242.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">değiştirebilir</text><rect x="610" y="16" width="270" height="270" rx="8" fill="#EEF5F8" stroke="#1E5A78" stroke-width="1.4"/><g transform="translate(745,42)"><rect x="-14" y="-6" width="16" height="12" rx="6" fill="none" stroke="#1E5A78" stroke-width="2.4"/><rect x="-2" y="-6" width="16" height="12" rx="6" fill="none" stroke="#1E5A78" stroke-width="2.4"/></g><text x="745" y="74.0" font-size="14" font-weight="700" fill="#174A63" text-anchor="middle" dominant-baseline="middle">Zincirde</text><text x="745" y="94.0" font-size="12" font-weight="600" fill="#4A4740" text-anchor="middle" dominant-baseline="middle">did:indy · did:ebsi · did:ion</text><line x1="626" y1="110" x2="864" y2="110" stroke="#D6E6EE" stroke-width="1.4"/><text x="745" y="132.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Değişiklikler defterde</text><text x="745" y="150.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kayıt altına alınır</text><text x="745" y="178.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Anahtar dönebilir,</text><text x="745" y="196.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">tanımlayıcı aynı kalır</text><text x="745" y="224.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Defter işletilmeli;</text><text x="745" y="242.0" font-size="12.5" font-weight="400" fill="#14120F" text-anchor="middle" dominant-baseline="middle">kapanırsa ne olur?</text><rect x="20" y="304" width="860" height="50" rx="8" fill="#FAF4E4" stroke="#C8A24C" stroke-width="1.4"/><text x="450" y="329.0" font-size="12.5" font-weight="600" fill="#14120F" text-anchor="middle" dominant-baseline="middle">Üçünde de açık kalan soru aynı: Bu tanımlayıcının arkasında gerçekten kim var ve o kurum yetkili mi?</text>
