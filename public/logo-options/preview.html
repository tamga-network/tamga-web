<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tamga — Logo Seçenekleri</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 48px 24px; background: #131314; color: #f4f3f1;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { font-weight: 600; letter-spacing: -0.02em; }
    p.sub { color: #9a958f; margin-top: -8px; }
    .grid {
      display: grid; gap: 24px; margin-top: 32px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .card {
      background: #191919; border: 1px solid #2a2a2a; border-radius: 16px;
      padding: 24px; text-align: center;
    }
    .card img { width: 110px; height: 110px; }
    .card .name { margin-top: 14px; font-family: ui-monospace, monospace; font-size: 13px; color: #c8a24c; }
    .card .desc { margin-top: 6px; font-size: 13px; color: #9a958f; }
    /* Açık zeminde nasıl durduğunu da göster */
    .light { background: #fafaf8; border-radius: 12px; padding: 12px; margin-top: 14px; }
    .light img { width: 72px; height: 72px; }
    .small { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 12px; }
    .small img { width: 28px; height: 28px; }
    .small span { font-size: 13px; color: #9a958f; }
  </style>
</head>
<body>
  <h1>Tamga Network — Logo Seçenekleri</h1>
  <p class="sub">Aşağıdan beğendiğin dosya adını söyle, onu ana logo olarak uygularım. (01 mevcut logodur.)</p>
  <div class="grid" id="grid"></div>

  <script>
    const items = [
      ["01-hexagon-current.svg", "Mevcut Logo", "Altıgen mühür + damga"],
      ["02-circle-seal.svg", "Yuvarlak Mühür", "Altın halka içinde damga"],
      ["03-kayi-iyi.svg", "Kayı / IYI", "Boy damgası esintili"],
      ["04-diamond-frame.svg", "Elmas Çerçeve", "Baklava dilimi mühür"],
      ["05-minimal-glyph.svg", "Sade Damga", "Çerçevesiz, kalın"],
      ["06-node-network.svg", "Ağ / Düğüm", "Blockchain teması"],
      ["07-monogram-t.svg", "Monogram T", "Altıgen içinde T"],
      ["08-solid-shield.svg", "Dolu Kalkan", "Dolu altın altıgen"],
    ];
    document.getElementById("grid").innerHTML = items.map(([file, name, desc]) => `
      <div class="card">
        <img src="./${file}" alt="${name}" />
        <div class="name">${file}</div>
        <div class="desc">${desc}</div>
        <div class="light"><img src="./${file}" alt="${name} açık zemin" /></div>
        <div class="small"><img src="./${file}" alt="" /><span>küçük boyut (header)</span></div>
      </div>
    `).join("");
  </script>
</body>
</html>
